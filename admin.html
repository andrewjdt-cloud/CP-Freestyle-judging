<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CP Freestyle – Admin Panel</title>

  <style>

    /* =========================================================
       CP FREESTYLE – ADMIN PANEL
       Clean competition control panel
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #08090c;
      --panel: #15161b;
      --panel-2: #1b1c22;
      --line: #2a2c33;
      --text: #f2f3f5;
      --muted: #a5a8b0;
      --green: #55d892;
      --red: #ff7070;
      --blue: #2f6fae;
      --purple: #5d438e;
      --button: #292b31;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background:
        radial-gradient(
          ellipse at top,
          #11131a 0%,
          var(--bg) 55%
        );
      color: var(--text);
    }

    .page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 12px 0 40px;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .page-header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: .01em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
    }


    /* =========================================================
       PANELS
       ========================================================= */

    .panel {
      background:
        linear-gradient(
          135deg,
          rgba(27, 28, 34, .98),
          rgba(20, 21, 26, .98)
        );
      border: 1px solid rgba(255, 255, 255, .025);
      border-radius: 16px;
      padding: 22px 20px 10px;
      margin-bottom: 18px;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, .18);
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 21px;
      letter-spacing: .01em;
    }


    /* =========================================================
       COMPETITION ROWS
       ========================================================= */

    .info-row {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(220px, 1.7fr) auto;
      align-items: center;
      gap: 18px;
      min-height: 51px;
      border-bottom: 1px solid var(--line);
    }

    .info-row:last-of-type {
      border-bottom: 1px solid var(--line);
    }

    .label {
      color: var(--muted);
      font-size: 15px;
      font-weight: 500;
    }

    .value {
      text-align: right;
      font-size: 15px;
      font-weight: 650;
      word-break: break-word;
    }

    .value.empty {
      color: var(--muted);
      font-weight: 500;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      font-weight: 750;
      letter-spacing: .02em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      background: currentColor;
    }

    .open,
    .yes,
    .active {
      color: var(--green);
    }

    .closed,
    .no,
    .inactive {
      color: var(--red);
    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    button {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 10px 15px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      transition:
        transform .12s ease,
        filter .12s ease,
        opacity .12s ease;
    }

    button:hover:not(:disabled) {
      filter: brightness(1.12);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .button-edit,
    .button-cancel {
      background: linear-gradient(
        180deg,
        #34363d,
        #292b31
      );
      box-shadow:
        inset 0 1px rgba(255, 255, 255, .06);
    }

    .button-save {
      background: linear-gradient(
        180deg,
        #169d62,
        #087a49
      );
    }

    .button-copy {
      background: linear-gradient(
        180deg,
        #346fa8,
        #235886
      );
    }

    .button-qr {
      background: linear-gradient(
        180deg,
        #7054a5,
        #533b81
      );
    }

    .button-small {
      padding: 9px 13px;
      font-size: 13px;
      white-space: nowrap;
    }

    .competition-actions {
      display: flex;
      justify-content: flex-end;
      padding: 20px 0 26px;
    }

    .competition-actions button {
      min-width: 210px;
      font-size: 15px;
    }


    /* =========================================================
       EDIT MODE
       ========================================================= */

    .hidden {
      display: none !important;
    }

    .edit-form {
      padding-bottom: 16px;
    }

    .form-row {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(280px, 1.7fr);
      align-items: center;
      gap: 18px;
      min-height: 58px;
      border-bottom: 1px solid var(--line);
    }

    input,
    select {
      width: 100%;
      padding: 11px 13px;
      border-radius: 8px;
      border: 1px solid #3a3c44;
      background: #202127;
      color: var(--text);
      font: inherit;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(85, 216, 146, .10);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 20px;
    }


    /* =========================================================
       MESSAGES
       ========================================================= */

    .message {
      min-height: 22px;
      padding-top: 12px;
      font-size: 14px;
      font-weight: 650;
    }

    .success {
      color: var(--green);
    }

    .error {
      color: var(--red);
      margin-bottom: 16px;
      font-weight: 650;
    }


    /* =========================================================
       JUDGES
       ========================================================= */

    .judge-header,
    .judge-row {
      display: grid;
      grid-template-columns: 82px minmax(180px, 1fr) 120px auto;
      align-items: center;
      gap: 18px;
    }

    .judge-header {
      min-height: 40px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      border-bottom: 1px solid var(--line);
    }

    .judge-row {
      min-height: 57px;
      border-bottom: 1px solid var(--line);
    }

    .judge-slot {
      font-weight: 750;
      color: #d9dbe0;
    }

    .judge-name {
      font-weight: 600;
    }

    .judge-status {
      text-align: right;
      font-size: 14px;
      font-weight: 750;
    }

    .judge-actions {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
    }

    .loading {
      color: var(--muted);
      padding: 20px 0;
    }


    /* =========================================================
       JUDGE EDITOR
       ========================================================= */

    .judge-editor {
      margin-top: 16px;
      padding: 18px;
      background: rgba(0, 0, 0, .14);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .judge-editor h3 {
      margin: 0 0 14px;
      font-size: 17px;
    }

    .judge-editor .form-row {
      grid-template-columns: 150px 1fr;
    }


    /* =========================================================
       QR MODAL
       ========================================================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .72);
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: min(380px, 100%);
      background: #1b1c22;
      border: 1px solid #363841;
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 20px 70px rgba(0, 0, 0, .5);
    }

    .modal-card h3 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .modal-subtitle {
      color: var(--muted);
      margin-bottom: 18px;
      font-size: 14px;
    }

    #qrImage {
      display: block;
      width: min(250px, 100%);
      aspect-ratio: 1;
      margin: 0 auto 18px;
      padding: 10px;
      background: #fff;
      border-radius: 10px;
    }

    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 700px) {

      .page {
        width: min(100% - 24px, 1120px);
        padding-top: 14px;
      }

      h1 {
        font-size: 24px;
      }

      .panel {
        padding: 18px 15px 8px;
      }

      .info-row {
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 13px 0;
      }

      .info-row .value {
        grid-column: 2;
      }

      .form-row {
        grid-template-columns: 1fr;
        gap: 7px;
        padding: 13px 0;
      }

      .judge-header,
      .judge-row {
        grid-template-columns: 58px minmax(0, 1fr) 76px;
        gap: 8px;
      }

      .judge-header div:last-child {
        display: none;
      }

      .judge-actions {
        grid-column: 1 / -1;
        justify-content: flex-end;
        padding-bottom: 10px;
      }

      .judge-row {
        padding: 10px 0 0;
      }

      .judge-status {
        font-size: 12px;
      }

      .competition-actions {
        padding-bottom: 18px;
      }

      .competition-actions button {
        width: 100%;
      }

      .form-actions {
        flex-wrap: wrap;
      }

      .form-actions button {
        flex: 1;
      }

      .judge-editor .form-row {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="page-header">
      <h1>CP Freestyle – Admin Panel</h1>
      <div class="subtitle">Competition setup overview</div>
    </header>

    <div id="pageError" class="error"></div>


    <div id="adminContent" class="hidden">

      <!-- ===================================================
           COMPETITION
           =================================================== -->

      <section class="panel">

        <h2>Competition</h2>


        <!-- READ MODE -->

        <div id="competitionReadMode">

          <div class="info-row">
            <div class="label">Event Name</div>
            <div class="value" id="eventName">—</div>
            <div></div>
          </div>

          <div class="info-row">
            <div class="label">Location</div>
            <div class="value" id="eventLocation">—</div>
            <div></div>
          </div>

          <div class="info-row">
            <div class="label">Current Round</div>
            <div class="value" id="eventRound">—</div>
            <div></div>
          </div>

          <div class="info-row">
            <div class="label">Round Status</div>
            <div class="value" id="roundStatus">—</div>
            <div></div>
          </div>

          <div class="info-row">
            <div class="label">Panel Insights</div>
            <div class="value" id="panelInsights">—</div>
            <div></div>
          </div>

          <div class="info-row">
            <div class="label">LiveToken</div>
            <div class="value" id="liveToken">—</div>
            <div></div>
          </div>

          <div class="competition-actions">
            <button
              type="button"
              class="button-edit"
              id="editCompetitionButton">
              Edit Competition Details
            </button>
          </div>

          <div
            id="competitionSuccess"
            class="message">
          </div>

        </div>


        <!-- EDIT MODE -->

        <div
          id="competitionEditMode"
          class="edit-form hidden">

          <div class="form-row">
            <label
              class="label"
              for="eventNameInput">
              Event Name
            </label>

            <input
              id="eventNameInput"
              type="text"
              autocomplete="off">
          </div>

          <div class="form-row">
            <label
              class="label"
              for="eventLocationInput">
              Location
            </label>

            <input
              id="eventLocationInput"
              type="text"
              autocomplete="off">
          </div>

          <div class="form-actions">
            <button
              type="button"
              class="button-cancel"
              id="cancelCompetitionButton">
              Cancel
            </button>

            <button
              type="button"
              class="button-save"
              id="saveCompetitionButton">
              Save Changes
            </button>
          </div>

          <div
            id="competitionSaveMessage"
            class="message">
          </div>

        </div>

      </section>


      <!-- ===================================================
           JUDGES
           =================================================== -->

      <section class="panel">

        <h2>Judges</h2>

        <div class="judge-header">
          <div>Judge Slot</div>
          <div>Judge Name</div>
          <div style="text-align:right;">Status</div>
          <div></div>
        </div>

        <div
          id="judges"
          class="loading">
          Loading judges...
        </div>


        <!-- JUDGE EDITOR -->

        <div
          id="judgeEditor"
          class="judge-editor hidden">

          <h3 id="judgeEditorTitle">
            Edit Judge
          </h3>

          <div class="form-row">
            <label
              class="label"
              for="judgeNameInput">
              Judge Name
            </label>

            <input
              id="judgeNameInput"
              type="text"
              autocomplete="off">
          </div>

          <div class="form-row">
            <label
              class="label"
              for="judgeTokenInput">
              Judge Token
            </label>

            <input
              id="judgeTokenInput"
              type="text"
              autocomplete="off">
          </div>

          <div class="form-row">
            <label
              class="label"
              for="judgeActiveInput">
              Status
            </label>

            <select id="judgeActiveInput">
              <option value="YES">ACTIVE</option>
              <option value="NO">INACTIVE</option>
            </select>
          </div>

          <div class="form-row">
            <label
              class="label"
              for="scoreboardIDInput">
              Judge Slot
            </label>

            <input
              id="scoreboardIDInput"
              type="text"
              autocomplete="off">
          </div>

          <div class="form-actions">
            <button
              type="button"
              class="button-cancel"
              id="cancelJudgeButton">
              Cancel
            </button>

            <button
              type="button"
              class="button-save"
              id="saveJudgeButton">
              Save Judge
            </button>
          </div>

          <div
            id="judgeSaveMessage"
            class="message">
          </div>

        </div>

      </section>

    </div>

  </main>


  <!-- =====================================================
       QR MODAL
       ===================================================== -->

  <div
    id="qrModal"
    class="modal"
    role="dialog"
    aria-modal="true">

    <div class="modal-card">

      <h3 id="qrTitle">Judge QR Code</h3>

      <div class="modal-subtitle">
        Scan to open the judge panel
      </div>

      <img
        id="qrImage"
        alt="Judge QR Code">

      <div class="modal-actions">
        <button
          type="button"
          class="button-cancel"
          id="closeQrButton">
          Close
        </button>
      </div>

    </div>

  </div>


  <script>

    /* =========================================================
       CONFIGURATION
       ========================================================= */

    const SHEET_ID =
      "1v839BJMAiCtXbSwRaS6jDq_oDxZgSYwU5sm4JwzrYUk";

    const EVENT_CONFIG_GID =
      "686531230";

    const JUDGES_GID =
      "1213944419";

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbx9xfxW7hyAT-3A5viq0REB2MKw4JAuBjUN4_YfHaE-kIV-G-7oLUvvaiLMtZhzYrr_/exec";


    /* =========================================================
       AUTHENTICATION
       ========================================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const adminToken =
      params.get("token");


    /* =========================================================
       PAGE STATE
       ========================================================= */

    let currentConfig = {};

    let currentEventName = "";
    let currentLocation = "";

    let currentJudges = [];

    let editingJudgeRow = null;


    /* =========================================================
       HELPERS
       ========================================================= */

    function sleep(milliseconds) {
      return new Promise(resolve => {
        setTimeout(resolve, milliseconds);
      });
    }


    function normalise(value) {
      return String(
        value ?? ""
      ).trim();
    }


    function getCellValue(cell) {

      if (!cell) {
        return "";
      }

      if (
        cell.v !== null &&
        cell.v !== undefined
      ) {
        return String(cell.v);
      }

      if (
        cell.f !== null &&
        cell.f !== undefined
      ) {
        return String(cell.f);
      }

      return "";
    }


    /* =========================================================
       READ GOOGLE SHEETS
       ========================================================= */

    async function getSheetData(gid) {

      const cacheBuster =
        Date.now();

      const url =
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${gid}&tqx=out:json&_=${cacheBuster}`;

      const response =
        await fetch(url, {
          cache: "no-store"
        });

      if (!response.ok) {
        throw new Error(
          "Could not load sheet data."
        );
      }

      const text =
        await response.text();

      const start =
        text.indexOf("{");

      const end =
        text.lastIndexOf("}") + 1;

      if (
        start === -1 ||
        end <= start
      ) {
        throw new Error(
          "Invalid response from Google Sheets."
        );
      }

      return JSON.parse(
        text.substring(start, end)
      );
    }


    /* =========================================================
       SEND ADMIN ACTION

       Apps Script is hosted separately from GitHub Pages, so
       this is deliberately a fire-and-forget POST. Every save
       is subsequently verified by reading the Sheet again.
       ========================================================= */

    async function sendAdminAction(data) {

      const body =
        JSON.stringify(data);

      const blob =
        new Blob(
          [body],
          {
            type:
              "text/plain;charset=UTF-8"
          }
        );

      if (
        navigator.sendBeacon &&
        navigator.sendBeacon(
          APPS_SCRIPT_URL,
          blob
        )
      ) {
        return;
      }

      await fetch(
        APPS_SCRIPT_URL,
        {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body
        }
      );
    }


    /* =========================================================
       LOAD EVENT CONFIG
       ========================================================= */

    async function loadEventConfig() {

      const sheetData =
        await getSheetData(
          EVENT_CONFIG_GID
        );

      const cfg = {};

      sheetData.table.rows.forEach(row => {

        if (
          !row.c ||
          row.c.length < 2
        ) {
          return;
        }

        const key =
          normalise(
            getCellValue(row.c[0])
          );

        const value =
          normalise(
            getCellValue(row.c[1])
          );

        if (key) {
          cfg[key] = value;
        }

      });

      currentConfig = cfg;

      currentEventName =
        cfg.EventName || "";

      currentLocation =
        cfg.Location || "";

      document
        .getElementById("eventName")
        .textContent =
          currentEventName || "—";

      document
        .getElementById("eventLocation")
        .textContent =
          currentLocation || "—";

      document
        .getElementById("eventRound")
        .textContent =
          cfg.CurrentRound ||
          cfg.Round ||
          "—";

      setRoundStatus(
        cfg.RoundStatus ||
        cfg.RoundOpen ||
        ""
      );

      setPanelInsights(
        cfg.PanelInsights ||
        cfg.Insights ||
        ""
      );

      document
        .getElementById("liveToken")
        .textContent =
          cfg.LiveToken || "—";
    }


    function setRoundStatus(value) {

      const element =
        document.getElementById(
          "roundStatus"
        );

      const raw =
        normalise(value).toUpperCase();

      element.className = "value";

      if (
        raw === "OPEN" ||
        raw === "YES" ||
        raw === "TRUE"
      ) {
        element.innerHTML =
          `<span class="status open">
            <span class="status-dot"></span>
            OPEN
          </span>`;

      } else if (
        raw === "CLOSED" ||
        raw === "NO" ||
        raw === "FALSE"
      ) {
        element.innerHTML =
          `<span class="status closed">
            <span class="status-dot"></span>
            CLOSED
          </span>`;

      } else {
        element.textContent =
          value || "—";
      }
    }


    function setPanelInsights(value) {

      const element =
        document.getElementById(
          "panelInsights"
        );

      const raw =
        normalise(value).toUpperCase();

      element.className = "value";

      if (
        raw === "ON" ||
        raw === "YES" ||
        raw === "TRUE"
      ) {
        element.innerHTML =
          `<span class="status yes">
            ON
          </span>`;

      } else if (
        raw === "OFF" ||
        raw === "NO" ||
        raw === "FALSE"
      ) {
        element.innerHTML =
          `<span class="status no">
            OFF
          </span>`;

      } else {
        element.textContent =
          value || "—";
      }
    }


    /* =========================================================
       LOAD JUDGES

       Judges sheet:
       A = Judge Name
       B = Judge Token
       C = Judge Active
       D = Scoreboard ID / Judge Slot
       E = Judge URL
       ========================================================= */

    async function loadJudges() {

      const container =
        document.getElementById(
          "judges"
        );

      const sheetData =
        await getSheetData(
          JUDGES_GID
        );

      const judges = [];

      sheetData.table.rows.forEach(
        (row, index) => {

          /*
             Skip the header row.
          */

          if (index === 0) {
            return;
          }

          if (!row.c) {
            return;
          }

          const name =
            normalise(
              getCellValue(row.c[0])
            );

          const token =
            normalise(
              getCellValue(row.c[1])
            );

          const active =
            normalise(
              getCellValue(row.c[2])
            ).toUpperCase();

          const scoreboardID =
            normalise(
              getCellValue(row.c[3])
            );

          const judgeUrl =
            normalise(
              getCellValue(row.c[4])
            );

          /*
             Keep the original spreadsheet row number.
             Header is row 1, so index 1 = sheet row 2.
          */

          if (
            name ||
            token ||
            scoreboardID
          ) {
            judges.push({
              sheetRow: index + 1,
              name,
              token,
              active,
              scoreboardID,
              judgeUrl
            });
          }

        }
      );

      currentJudges = judges;

      container.innerHTML = "";

      if (!judges.length) {
        container.innerHTML =
          `<div class="loading">
            No judges found.
          </div>`;
        return;
      }

      judges.forEach(judge => {

        const row =
          document.createElement("div");

        row.className =
          "judge-row";

        const isActive =
          (
            judge.active === "YES" ||
            judge.active === "ACTIVE" ||
            judge.active === "TRUE"
          );

        const statusText =
          isActive
            ? "ACTIVE"
            : "INACTIVE";

        const slot =
          judge.scoreboardID ||
          `J${judge.sheetRow - 1}`;

        row.innerHTML = `
          <div class="judge-slot">
            ${escapeHtml(slot)}
          </div>

          <div class="judge-name">
            ${escapeHtml(
              judge.name || "—"
            )}
          </div>

          <div class="judge-status">
            <span class="status ${
              isActive
                ? "active"
                : "inactive"
            }">
              ${statusText}
            </span>
          </div>

          <div class="judge-actions">

            <button
              type="button"
              class="button-copy button-small">
              Copy URL
            </button>

            <button
              type="button"
              class="button-qr button-small">
              QR
            </button>

            <button
              type="button"
              class="button-edit button-small">
              Edit
            </button>

          </div>
        `;

        const buttons =
          row.querySelectorAll("button");

        buttons[0]
          .addEventListener(
            "click",
            () => copyJudgeUrl(judge)
          );

        buttons[1]
          .addEventListener(
            "click",
            () => showQr(judge)
          );

        buttons[2]
          .addEventListener(
            "click",
            () => openJudgeEditor(judge)
          );

        container.appendChild(row);

      });
    }


    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /* =========================================================
       COPY JUDGE URL
       ========================================================= */

    async function copyJudgeUrl(judge) {

      const url =
        judge.judgeUrl;

      if (!url) {
        alert(
          "No Judge URL was found for this judge."
        );
        return;
      }

      try {

        await navigator.clipboard.writeText(
          url
        );

      } catch (error) {

        const textarea =
          document.createElement("textarea");

        textarea.value = url;

        document.body.appendChild(
          textarea
        );

        textarea.select();

        document.execCommand(
          "copy"
        );

        textarea.remove();
      }
    }


    /* =========================================================
       QR CODE
       ========================================================= */

    function showQr(judge) {

      if (!judge.judgeUrl) {
        alert(
          "No Judge URL was found for this judge."
        );
        return;
      }

      document
        .getElementById("qrTitle")
        .textContent =
          judge.name ||
          judge.scoreboardID ||
          "Judge QR Code";

      /*
         QR image service is only used to display the URL as
         a QR code. The judge URL itself remains unchanged.
      */

      document
        .getElementById("qrImage")
        .src =
          "https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=" +
          encodeURIComponent(
            judge.judgeUrl
          );

      document
        .getElementById("qrModal")
        .classList.add("show");
    }


    document
      .getElementById("closeQrButton")
      .addEventListener(
        "click",
        closeQr
      );


    document
      .getElementById("qrModal")
      .addEventListener(
        "click",
        event => {

          if (
            event.target.id === "qrModal"
          ) {
            closeQr();
          }

        }
      );


    function closeQr() {

      document
        .getElementById("qrModal")
        .classList.remove("show");
    }


    /* =========================================================
       JUDGE EDITOR
       ========================================================= */

    function openJudgeEditor(judge) {

      editingJudgeRow =
        judge.sheetRow;

      document
        .getElementById(
          "judgeEditorTitle"
        )
        .textContent =
          `Edit ${judge.scoreboardID || "Judge"}`;

      document
        .getElementById(
          "judgeNameInput"
        )
        .value =
          judge.name;

      document
        .getElementById(
          "judgeTokenInput"
        )
        .value =
          judge.token;

      document
        .getElementById(
          "judgeActiveInput"
        )
        .value =
          (
            judge.active === "YES" ||
            judge.active === "ACTIVE"
          )
            ? "YES"
            : "NO";

      document
        .getElementById(
          "scoreboardIDInput"
        )
        .value =
          judge.scoreboardID;

      document
        .getElementById(
          "judgeSaveMessage"
        )
        .textContent =
          "";

      document
        .getElementById(
          "judgeEditor"
        )
        .classList.remove("hidden");

      document
        .getElementById(
          "judgeEditor"
        )
        .scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });
    }


    document
      .getElementById("cancelJudgeButton")
      .addEventListener(
        "click",
        () => {

          editingJudgeRow = null;

          document
            .getElementById(
              "judgeEditor"
            )
            .classList.add("hidden");

        }
      );


    document
      .getElementById("saveJudgeButton")
      .addEventListener(
        "click",
        saveJudge
      );


    async function saveJudge() {

      const message =
        document.getElementById(
          "judgeSaveMessage"
        );

      const saveButton =
        document.getElementById(
          "saveJudgeButton"
        );

      const judgeName =
        document
          .getElementById(
            "judgeNameInput"
          )
          .value
          .trim();

      const judgeToken =
        document
          .getElementById(
            "judgeTokenInput"
          )
          .value
          .trim();

      const judgeActive =
        document
          .getElementById(
            "judgeActiveInput"
          )
          .value;

      const scoreboardID =
        document
          .getElementById(
            "scoreboardIDInput"
          )
          .value
          .trim();

      message.textContent = "";
      message.className = "message";

      if (!judgeName) {
        showJudgeError(
          "Judge Name cannot be empty."
        );
        return;
      }

      if (!judgeToken) {
        showJudgeError(
          "Judge Token cannot be empty."
        );
        return;
      }

      if (!scoreboardID) {
        showJudgeError(
          "Judge Slot cannot be empty."
        );
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Saving...";

      try {

        await sendAdminAction({
          action:
            "updateJudgeDetails",
          adminToken,
          sheetRow:
            editingJudgeRow,
          judgeName,
          judgeToken,
          judgeActive,
          scoreboardID
        });


        /*
           Re-read the Sheet and confirm the save.
        */

        let saved = false;

        for (
          let attempt = 0;
          attempt < 5;
          attempt++
        ) {

          await sleep(1000);

          await loadJudges();

          const confirmed =
            currentJudges.find(
              judge =>
                judge.sheetRow ===
                editingJudgeRow
            );

          if (
            confirmed &&
            confirmed.name === judgeName &&
            confirmed.token === judgeToken &&
            (
              confirmed.active ===
                judgeActive ||
              (
                judgeActive === "YES" &&
                confirmed.active === "ACTIVE"
              )
            ) &&
            confirmed.scoreboardID ===
              scoreboardID
          ) {
            saved = true;
            break;
          }
        }

        if (!saved) {
          throw new Error(
            "The sheet did not confirm the judge changes."
          );
        }

        message.textContent =
          "Judge details saved successfully.";

        message.className =
          "message success";

        editingJudgeRow = null;

        setTimeout(() => {

          document
            .getElementById(
              "judgeEditor"
            )
            .classList.add("hidden");

        }, 800);

      } catch (error) {

        showJudgeError(
          "Could not save judge: " +
          (
            error.message ||
            String(error)
          )
        );

      } finally {

        saveButton.disabled = false;
        saveButton.textContent =
          "Save Judge";
      }
    }


    function showJudgeError(text) {

      const message =
        document.getElementById(
          "judgeSaveMessage"
        );

      message.textContent = text;
      message.className =
        "message error";
    }


    /* =========================================================
       COMPETITION EDIT MODE
       ========================================================= */

    document
      .getElementById(
        "editCompetitionButton"
      )
      .addEventListener(
        "click",
        () => {

          document
            .getElementById(
              "eventNameInput"
            )
            .value =
              currentEventName;

          document
            .getElementById(
              "eventLocationInput"
            )
            .value =
              currentLocation;

          document
            .getElementById(
              "competitionSaveMessage"
            )
            .textContent =
              "";

          document
            .getElementById(
              "competitionSuccess"
            )
            .textContent =
              "";

          document
            .getElementById(
              "competitionReadMode"
            )
            .classList.add("hidden");

          document
            .getElementById(
              "competitionEditMode"
            )
            .classList.remove("hidden");

          document
            .getElementById(
              "eventNameInput"
            )
            .focus();

        }
      );


    document
      .getElementById(
        "cancelCompetitionButton"
      )
      .addEventListener(
        "click",
        closeCompetitionEditor
      );


    function closeCompetitionEditor() {

      document
        .getElementById(
          "competitionEditMode"
        )
        .classList.add("hidden");

      document
        .getElementById(
          "competitionReadMode"
        )
        .classList.remove("hidden");

      document
        .getElementById(
          "competitionSaveMessage"
        )
        .textContent =
          "";
    }


    /* =========================================================
       SAVE COMPETITION DETAILS
       ========================================================= */

    document
      .getElementById(
        "saveCompetitionButton"
      )
      .addEventListener(
        "click",
        saveCompetition
      );


    async function saveCompetition() {

      const newEventName =
        document
          .getElementById(
            "eventNameInput"
          )
          .value
          .trim();

      const newLocation =
        document
          .getElementById(
            "eventLocationInput"
          )
          .value
          .trim();

      const saveButton =
        document.getElementById(
          "saveCompetitionButton"
        );

      const message =
        document.getElementById(
          "competitionSaveMessage"
        );

      message.textContent = "";
      message.className = "message";

      if (!newEventName) {
        showCompetitionError(
          "Event Name cannot be empty."
        );
        return;
      }

      if (!newLocation) {
        showCompetitionError(
          "Location cannot be empty."
        );
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Saving...";

      try {

        await sendAdminAction({
          action:
            "updateCompetitionDetails",
          adminToken,
          eventName:
            newEventName,
          location:
            newLocation
        });


        /*
           Re-read and confirm the save.
        */

        let saved = false;

        for (
          let attempt = 0;
          attempt < 5;
          attempt++
        ) {

          await sleep(1000);

          await loadEventConfig();

          if (
            currentEventName ===
              newEventName &&
            currentLocation ===
              newLocation
          ) {
            saved = true;
            break;
          }
        }

        if (!saved) {
          throw new Error(
            "The sheet did not confirm the changes."
          );
        }

        closeCompetitionEditor();

        const success =
          document.getElementById(
            "competitionSuccess"
          );

        success.textContent =
          "Competition details saved successfully.";

        success.className =
          "message success";

      } catch (error) {

        showCompetitionError(
          "Could not save changes: " +
          (
            error.message ||
            String(error)
          )
        );

      } finally {

        saveButton.disabled = false;
        saveButton.textContent =
          "Save Changes";
      }
    }


    function showCompetitionError(text) {

      const message =
        document.getElementById(
          "competitionSaveMessage"
        );

      message.textContent = text;
      message.className =
        "message error";
    }


    /* =========================================================
       INITIAL LOAD
       ========================================================= */

    async function initialise() {

      const pageError =
        document.getElementById(
          "pageError"
        );

      try {

        /*
           The Apps Script performs the actual security check
           whenever something is saved. The token is passed
           through unchanged from the Admin URL.
        */

        await Promise.all([
          loadEventConfig(),
          loadJudges()
        ]);

        document
          .getElementById(
            "adminContent"
          )
          .classList.remove("hidden");

      } catch (error) {

        pageError.textContent =
          "Could not load the Admin Panel: " +
          (
            error.message ||
            String(error)
          );
      }
    }


    initialise();

  </script>

</body>
