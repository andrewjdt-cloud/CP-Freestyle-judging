<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CP Freestyle – Admin Panel</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    h2 {
      margin: 0 0 6px 0;
      font-size: 28px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 24px;
      font-size: 17px;
    }

    .section {
      background: #151515;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 22px;
    }

    .section h3 {
      margin: 0 0 20px 0;
      font-size: 22px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #303030;
      gap: 25px;
    }

    .label {
      color: #b5b5b5;
      font-size: 16px;
      flex: 1;
    }

    .value {
      text-align: right;
      font-weight: 600;
      flex: 1;
      word-break: break-word;
    }

    .edit-input {
      background: #202020;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      padding: 11px 12px;
      width: 60%;
      text-align: right;
    }

    .edit-input:focus {
      outline: none;
      border-color: #00c96b;
    }

    .status-open,
    .status-yes {
      color: #42d88b;
    }

    .status-closed,
    .status-no {
      color: #ff6b6b;
    }

    .judge-header,
    .judge {
      display: grid;
      grid-template-columns: 180px 1fr 120px;
      gap: 18px;
      align-items: center;
    }

    .judge-header {
      color: #aaa;
      font-weight: 600;
      padding: 10px 0 12px 0;
      border-bottom: 1px solid #303030;
    }

    .judge-header-status {
      text-align: right;
    }

    .judge {
      padding: 15px 0;
      border-bottom: 1px solid #303030;
    }

    .judge-number {
      font-weight: 700;
      color: #e0e0e0;
    }

    .judge-status {
      text-align: right;
      font-weight: 700;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .edit-button,
    .cancel-button {
      background: #2b2b2b;
      color: #fff;
    }

    .save-button {
      background: #08a95b;
      color: #fff;
    }

    .error {
      color: #ff6b6b;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .success-message {
      color: #42d88b;
      margin-top: 16px;
      font-weight: 650;
      min-height: 24px;
    }

    .save-error {
      color: #ff6b6b;
      margin-top: 16px;
      font-weight: 650;
      min-height: 24px;
    }

    .loading {
      color: #aaa;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      h2 {
        font-size: 24px;
      }

      .section {
        padding: 18px;
      }

      .info-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .value,
      .edit-input {
        text-align: left;
        width: 100%;
      }

      .judge-header,
      .judge {
        grid-template-columns: 85px 1fr 85px;
        gap: 8px;
      }

      .judge-header {
        font-size: 13px;
      }

      .judge-status {
        text-align: right;
      }

      .actions {
        width: 100%;
      }

      button {
        flex: 1;
      }

    }

  </style>
</head>

<body>

  <h2>CP Freestyle – Admin Panel</h2>
  <div class="subtitle">Competition setup overview</div>

  <div id="error" class="error"></div>

  <div id="adminContent" style="display:none;">

    <!-- COMPETITION -->

    <div class="section">

      <h3>Competition</h3>

      <!-- READ MODE -->

      <div id="competitionReadMode">

        <div class="info-row">
          <span class="label">Event Name</span>
          <span class="value" id="eventName">—</span>
        </div>

        <div class="info-row">
          <span class="label">Location</span>
          <span class="value" id="eventLocation">—</span>
        </div>

        <div class="info-row">
          <span class="label">Current Round</span>
          <span class="value" id="eventRound">—</span>
        </div>

        <div class="info-row">
          <span class="label">Round Status</span>
          <span class="value" id="roundStatus">—</span>
        </div>

        <div class="info-row">
          <span class="label">Panel Insights</span>
          <span class="value" id="panelInsights">—</span>
        </div>

        <div class="actions">
          <button
            type="button"
            class="edit-button"
            id="editCompetitionButton">
            Edit Competition Details
          </button>
        </div>

        <div id="successMessage" class="success-message"></div>

      </div>


      <!-- EDIT MODE -->

      <div id="competitionEditMode" class="hidden">

        <div class="info-row">
          <label class="label" for="eventNameInput">
            Event Name
          </label>

          <input
            class="edit-input"
            id="eventNameInput"
            type="text"
            autocomplete="off">
        </div>

        <div class="info-row">
          <label class="label" for="eventLocationInput">
            Location
          </label>

          <input
            class="edit-input"
            id="eventLocationInput"
            type="text"
            autocomplete="off">
        </div>

        <div class="actions">

          <button
            type="button"
            class="cancel-button"
            id="cancelCompetitionButton">
            Cancel
          </button>

          <button
            type="button"
            class="save-button"
            id="saveCompetitionButton">
            Save Changes
          </button>

        </div>

        <div id="saveError" class="save-error"></div>

      </div>

    </div>


    <!-- JUDGES -->

    <div class="section">

      <h3>Judges</h3>

      <div class="judge-header">
        <div>Scoreboard ID</div>
        <div>Judge Name</div>
        <div class="judge-header-status">Status</div>
      </div>

      <div id="judges" class="loading">
        Loading judges...
      </div>

    </div>

  </div>


  <script>

    /* =========================================================
       CONFIGURATION
       ========================================================= */

    const SHEET_ID = "1v839BJMAiCtXbSwRaS6jDq_oDxZgSYwU5sm4JwzrYUk";

    const EVENT_CONFIG_GID = "686531230";

    const JUDGES_GID = "1213944419";

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbx9xfXW7hyAT-3A5viq0REB2MKw4JAuBjUN4_YfHaE-kIV-G-7oLUvvaiLMtZhzYrr_/exec";


    /* =========================================================
       AUTHENTICATION
       ========================================================= */

    const params = new URLSearchParams(window.location.search);
    const adminToken = params.get("token");


    /* =========================================================
       PAGE STATE
       ========================================================= */

    let currentEventName = "";
    let currentLocation = "";


    /* =========================================================
       DELAY HELPER
       ========================================================= */

    function sleep(milliseconds) {
      return new Promise(resolve => {
        setTimeout(resolve, milliseconds);
      });
    }


    /* =========================================================
       READ GOOGLE SHEET

       The timestamp prevents an old cached response from being
       used when we are checking whether a save succeeded.
       ========================================================= */

    function getSheetData(gid) {

      const cacheBuster = Date.now();

      const url =
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${gid}&tqx=out:json&_=${cacheBuster}`;

      return fetch(url, {
        cache: "no-store"
      })
        .then(response => {

          if (!response.ok) {
            throw new Error("Could not load sheet data.");
          }

          return response.text();

        })
        .then(text => {

          const start = text.indexOf("{");
          const end = text.lastIndexOf("}") + 1;

          if (start === -1 || end === 0) {
            throw new Error("Invalid response from Google Sheets.");
          }

          return JSON.parse(text.substring(start, end));

        });

    }


    /* =========================================================
       SEND ADMIN ACTION

       Apps Script does not provide normal CORS headers to this
       separately hosted GitHub Pages site, so this request is
       deliberately fire-and-forget.

       The sheet is subsequently re-read and verified.
       ========================================================= */

    function sendAdminAction(data) {

      const body = JSON.stringify(data);

      /*
         sendBeacon sends a text/plain POST, which is exactly what
         our Apps Script doPost(JSON.parse(e.postData.contents))
         expects.
      */

      if (navigator.sendBeacon) {

        const blob = new Blob(
          [body],
          { type: "text/plain;charset=UTF-8" }
        );

        const sent =
          navigator.sendBeacon(APPS_SCRIPT_URL, blob);

        if (sent) {
          return Promise.resolve();
        }

      }

      /*
         Fallback for browsers where sendBeacon is unavailable.
      */

      return fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: body
      });

    }


    /* =========================================================
       LOAD EVENT CONFIGURATION
       ========================================================= */

    function loadEventConfig() {

      return getSheetData(EVENT_CONFIG_GID)
        .then(sheetData => {

          const cfg = {};

          sheetData.table.rows.forEach(row => {

            if (!row.c) {
              return;
            }

            const key =
              row.c[0] && row.c[0].v !== null
                ? String(row.c[0].v).trim()
                : "";

            const value =
              row.c[1] && row.c[1].v !== null
                ? String(row.c[1].v).trim()
                : "";

            if (key) {
              cfg[key] = value;
            }

          });


          if (!adminToken || cfg.AdminToken !== adminToken) {
            throw new Error("Access denied.");
          }


          currentEventName = cfg.EventName || "";
          currentLocation = cfg.Location || "";


          document.getElementById("eventName").textContent =
            currentEventName || "—";

          document.getElementById("eventLocation").textContent =
            currentLocation || "—";

          document.getElementById("eventRound").textContent =
            cfg.Round || "—";


          const roundOpen =
            (cfg.RoundOpen || "").toUpperCase();

          const roundStatus =
            document.getElementById("roundStatus");

          if (roundOpen === "YES") {

            roundStatus.textContent = "● OPEN";
            roundStatus.className = "value status-open";

          } else {

            roundStatus.textContent = "● CLOSED";
            roundStatus.className = "value status-closed";

          }


          const insights =
            (cfg.PanelInsights || "").toUpperCase();

          const insightsStatus =
            document.getElementById("panelInsights");

          if (insights === "YES") {

            insightsStatus.textContent = "ON";
            insightsStatus.className = "value status-yes";

          } else {

            insightsStatus.textContent = "OFF";
            insightsStatus.className = "value status-no";

          }


          document.getElementById("adminContent").style.display =
            "block";

        });

    }


    /* =========================================================
       LOAD JUDGES
       ========================================================= */

    function loadJudges() {

      return getSheetData(JUDGES_GID)
        .then(sheetData => {

          const judgesDiv =
            document.getElementById("judges");

          judgesDiv.innerHTML = "";

          sheetData.table.rows.forEach(row => {

            if (!row.c) {
              return;
            }

            const name =
              row.c[0] && row.c[0].v !== null
                ? String(row.c[0].v).trim()
                : "";

            const active =
              row.c[2] && row.c[2].v !== null
                ? String(row.c[2].v).trim().toUpperCase()
                : "";

            const scoreboardID =
              row.c[3] && row.c[3].v !== null
                ? String(row.c[3].v).trim()
                : "";


            /* Ignore a header row if present */

            const nameUpper = name.toUpperCase();
            const idUpper = scoreboardID.toUpperCase();

            if (
              nameUpper === "JUDGENAME" ||
              nameUpper === "JUDGE NAME" ||
              idUpper === "SCOREBOARDID" ||
              idUpper === "SCOREBOARD ID"
            ) {
              return;
            }


            if (!name && !scoreboardID) {
              return;
            }


            const judgeRow =
              document.createElement("div");

            judgeRow.className = "judge";


            const idElement =
              document.createElement("div");

            idElement.className = "judge-number";
            idElement.textContent = scoreboardID || "—";


            const nameElement =
              document.createElement("div");

            nameElement.textContent =
              name || "Unnamed Judge";


            const statusElement =
              document.createElement("div");

            statusElement.className = "judge-status";

            if (active === "YES") {

              statusElement.textContent = "ACTIVE";
              statusElement.classList.add("status-yes");

            } else {

              statusElement.textContent = "INACTIVE";
              statusElement.classList.add("status-no");

            }


            judgeRow.appendChild(idElement);
            judgeRow.appendChild(nameElement);
            judgeRow.appendChild(statusElement);

            judgesDiv.appendChild(judgeRow);

          });


          if (!judgesDiv.children.length) {
            judgesDiv.textContent = "No judges configured.";
          }

        })
        .catch(() => {

          document.getElementById("judges").textContent =
            "Could not load judges.";

        });

    }


    /* =========================================================
       OPEN EDIT MODE
       ========================================================= */

    document
      .getElementById("editCompetitionButton")
      .addEventListener("click", () => {

        document.getElementById("eventNameInput").value =
          currentEventName;

        document.getElementById("eventLocationInput").value =
          currentLocation;

        document.getElementById("saveError").textContent = "";
        document.getElementById("successMessage").textContent = "";

        document
          .getElementById("competitionReadMode")
          .classList.add("hidden");

        document
          .getElementById("competitionEditMode")
          .classList.remove("hidden");

        document.getElementById("eventNameInput").focus();

      });


    /* =========================================================
       CANCEL EDIT MODE
       ========================================================= */

    document
      .getElementById("cancelCompetitionButton")
      .addEventListener("click", () => {

        document
          .getElementById("competitionEditMode")
          .classList.add("hidden");

        document
          .getElementById("competitionReadMode")
          .classList.remove("hidden");

        document.getElementById("saveError").textContent = "";

      });


    /* =========================================================
       SAVE COMPETITION DETAILS
       ========================================================= */

    document
      .getElementById("saveCompetitionButton")
      .addEventListener("click", async () => {

        const newEventName =
          document
            .getElementById("eventNameInput")
            .value
            .trim();

        const newLocation =
          document
            .getElementById("eventLocationInput")
            .value
            .trim();

        const saveButton =
          document.getElementById("saveCompetitionButton");

        const saveError =
          document.getElementById("saveError");

        const successMessage =
          document.getElementById("successMessage");


        saveError.textContent = "";
        successMessage.textContent = "";


        if (!newEventName) {
          saveError.textContent =
            "Event Name cannot be empty.";
          return;
        }

        if (!newLocation) {
          saveError.textContent =
            "Location cannot be empty.";
          return;
        }


        saveButton.disabled = true;
        saveButton.textContent = "Saving...";


        try {

          /*
             Send the update.
          */

          await sendAdminAction({
            action: "updateCompetitionDetails",
            adminToken: adminToken,
            eventName: newEventName,
            location: newLocation
          });


          /*
             Apps Script and Google Sheets can take a moment to
             make a write visible to a subsequent read.

             Check several times rather than failing immediately.
          */

          let saved = false;

          for (let attempt = 0; attempt < 5; attempt++) {

            await sleep(1000);

            await loadEventConfig();

            if (
              currentEventName === newEventName &&
              currentLocation === newLocation
            ) {
              saved = true;
              break;
            }

          }


          if (!saved) {
            throw new Error(
              "The update was sent, but the sheet did not confirm the changes."
            );
          }


          document
            .getElementById("competitionEditMode")
            .classList.add("hidden");

          document
            .getElementById("competitionReadMode")
            .classList.remove("hidden");


          successMessage.textContent =
            "Competition details saved successfully.";


        } catch (err) {

          saveError.textContent =
            "Could not save changes: " +
            (err.message || String(err));

        } finally {

          saveButton.disabled = false;
          saveButton.textContent = "Save Changes";

        }

      });


    /* =========================================================
       INITIAL PAGE LOAD
       ========================================================= */

    loadEventConfig()
      .then(() => loadJudges())
      .catch(err => {

        document.getElementById("error").textContent =
          err.message || "Could not load the Admin Panel.";

      });

  </script>

</body>
</html>
