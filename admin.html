<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>CP Freestyle – Admin Panel</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0b;
      color: #f5f5f5;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    h2 {
      margin: 0 0 6px 0;
      font-size: 28px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 24px;
      font-size: 17px;
    }

    /* =========================================================
       SECTIONS
       ========================================================= */

    .section {
      background: #151515;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 22px;
    }

    .section h3 {
      margin: 0 0 20px 0;
      font-size: 22px;
    }

    /* =========================================================
       COMPETITION INFORMATION
       ========================================================= */

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #303030;
      gap: 25px;
    }

    .label {
      color: #b5b5b5;
      font-size: 16px;
      flex: 1;
    }

    .value {
      text-align: right;
      font-weight: 600;
      flex: 1;
      word-break: break-word;
    }

    /* =========================================================
       INPUTS
       ========================================================= */

    .edit-input,
    .judge-input,
    .judge-select {
      background: #202020;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      padding: 11px 12px;
    }

    .edit-input {
      width: 60%;
      text-align: right;
    }

    .edit-input:focus,
    .judge-input:focus,
    .judge-select:focus {
      outline: none;
      border-color: #00c96b;
    }

    /* =========================================================
       STATUS COLOURS
       ========================================================= */

    .status-open,
    .status-yes {
      color: #42d88b;
    }

    .status-closed,
    .status-no {
      color: #ff6b6b;
    }

    /* =========================================================
       JUDGES LIST
       ========================================================= */

    .judge-header,
    .judge {
      display: grid;
      grid-template-columns: 140px 1fr 120px 90px;
      gap: 18px;
      align-items: center;
    }

    .judge-header {
      color: #aaa;
      font-weight: 600;
      padding: 10px 0 12px 0;
      border-bottom: 1px solid #303030;
    }

    .judge-header-status {
      text-align: right;
    }

    .judge {
      padding: 15px 0;
      border-bottom: 1px solid #303030;
    }

    .judge:last-child {
      border-bottom: none;
    }

    .judge-number {
      font-weight: 700;
      color: #e0e0e0;
    }

    .judge-status {
      text-align: right;
      font-weight: 700;
    }

    .judge-edit-button {
      padding: 9px 14px;
      font-size: 14px;
      background: #2b2b2b;
      color: #fff;
      justify-self: end;
    }

    /* =========================================================
       JUDGE EDITOR
       ========================================================= */

    .judge-editor {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #303030;
    }

    .judge-editor h4 {
      margin: 0 0 18px 0;
      font-size: 18px;
    }

    .judge-edit-row {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 11px 0;
      border-bottom: 1px solid #282828;
    }

    .judge-edit-row label {
      color: #b5b5b5;
      flex: 0 0 160px;
    }

    .judge-input,
    .judge-select {
      flex: 1;
      min-width: 0;
    }

    .judge-message {
      min-height: 24px;
      margin-top: 16px;
      font-weight: 650;
    }

    /* =========================================================
       BUTTONS
       ========================================================= */

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .edit-button,
    .cancel-button {
      background: #2b2b2b;
      color: #fff;
    }

    .save-button {
      background: #08a95b;
      color: #fff;
    }

    /* =========================================================
       MESSAGES
       ========================================================= */

    .error {
      color: #ff6b6b;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .success-message {
      color: #42d88b;
      margin-top: 16px;
      font-weight: 650;
      min-height: 24px;
    }

    .save-error {
      color: #ff6b6b;
      margin-top: 16px;
      font-weight: 650;
      min-height: 24px;
    }

    .loading {
      color: #aaa;
    }

    .hidden {
      display: none !important;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 600px) {

      body {
        padding: 12px;
      }

      h2 {
        font-size: 24px;
      }

      .section {
        padding: 18px;
      }

      .info-row,
      .judge-edit-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      .value,
      .edit-input,
      .judge-input,
      .judge-select {
        text-align: left;
        width: 100%;
      }

      .judge-edit-row label {
        flex: none;
      }

      .judge-header,
      .judge {
        grid-template-columns: 75px 1fr 75px;
        gap: 8px;
      }

      .judge-header div:last-child,
      .judge-edit-button {
        display: none;
      }

      .judge-header {
        font-size: 12px;
      }

      .judge-status {
        text-align: right;
      }

      .actions {
        width: 100%;
      }

      button {
        flex: 1;
      }

    }

  </style>
</head>

<body>

  <h2>CP Freestyle – Admin Panel</h2>
  <div class="subtitle">Competition setup overview</div>

  <div id="error" class="error"></div>

  <div id="adminContent" style="display:none;">

    <!-- =====================================================
         COMPETITION
         ===================================================== -->

    <div class="section">

      <h3>Competition</h3>

      <!-- READ MODE -->

      <div id="competitionReadMode">

        <div class="info-row">
          <span class="label">Event Name</span>
          <span class="value" id="eventName">—</span>
        </div>

        <div class="info-row">
          <span class="label">Location</span>
          <span class="value" id="eventLocation">—</span>
        </div>

        <div class="info-row">
          <span class="label">Current Round</span>
          <span class="value" id="eventRound">—</span>
        </div>

        <div class="info-row">
          <span class="label">Round Status</span>
          <span class="value" id="roundStatus">—</span>
        </div>

        <div class="info-row">
          <span class="label">Panel Insights</span>
          <span class="value" id="panelInsights">—</span>
        </div>

        <div class="actions">
          <button
            type="button"
            class="edit-button"
            id="editCompetitionButton">
            Edit Competition Details
          </button>
        </div>

        <div id="successMessage" class="success-message"></div>

      </div>


      <!-- EDIT MODE -->

      <div id="competitionEditMode" class="hidden">

        <div class="info-row">

          <label class="label" for="eventNameInput">
            Event Name
          </label>

          <input
            class="edit-input"
            id="eventNameInput"
            type="text">

        </div>

        <div class="info-row">

          <label class="label" for="eventLocationInput">
            Location
          </label>

          <input
            class="edit-input"
            id="eventLocationInput"
            type="text">

        </div>

        <div class="actions">

          <button
            type="button"
            class="cancel-button"
            id="cancelCompetitionButton">
            Cancel
          </button>

          <button
            type="button"
            class="save-button"
            id="saveCompetitionButton">
            Save Changes
          </button>

        </div>

        <div id="saveError" class="save-error"></div>

      </div>

    </div>


    <!-- =====================================================
         JUDGES
         ===================================================== -->

    <div class="section">

      <h3>Judges</h3>

      <div class="judge-header">
        <div>Scoreboard ID</div>
        <div>Judge Name</div>
        <div class="judge-header-status">Status</div>
        <div></div>
      </div>

      <div id="judges" class="loading">
        Loading judges...
      </div>


      <!-- JUDGE EDITOR -->

      <div id="judgeEditor" class="judge-editor hidden">

        <h4>Edit Judge</h4>

        <div class="judge-edit-row">

          <label for="judgeNameInput">
            Judge Name
          </label>

          <input
            class="judge-input"
            id="judgeNameInput"
            type="text">

        </div>

        <div class="judge-edit-row">

          <label for="judgeTokenInput">
            Judge Token
          </label>

          <input
            class="judge-input"
            id="judgeTokenInput"
            type="text">

        </div>

        <div class="judge-edit-row">

          <label for="judgeActiveInput">
            Judge Status
          </label>

          <select
            class="judge-select"
            id="judgeActiveInput">

            <option value="YES">ACTIVE</option>
            <option value="NO">INACTIVE</option>

          </select>

        </div>

        <div class="judge-edit-row">

          <label for="scoreboardIDInput">
            Scoreboard ID
          </label>

          <input
            class="judge-input"
            id="scoreboardIDInput"
            type="text">

        </div>

        <div class="actions">

          <button
            type="button"
            class="cancel-button"
            id="cancelJudgeButton">
            Cancel
          </button>

          <button
            type="button"
            class="save-button"
            id="saveJudgeButton">
            Save Judge
          </button>

        </div>

        <div id="judgeSaveMessage" class="judge-message"></div>

      </div>

    </div>

  </div>


  <script>

    /* =========================================================
       CONFIGURATION
       ========================================================= */

    const SHEET_ID =
      "1v839BJMAiCtXbSwRaS6jDq_oDxZgSYwU5sm4JwzrYUk";

    const EVENT_CONFIG_GID =
      "686531230";

    const JUDGES_GID =
      "1213944419";

    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbx9xfxW7hyAT-3A5viq0REB2MKw4JAuBjUN4_YfHaE-kIV-G-7oLUvvaiLMtZhzYrr_/exec";


    /* =========================================================
       AUTHENTICATION
       ========================================================= */

    const params =
      new URLSearchParams(window.location.search);

    const adminToken =
      params.get("token");


    /* =========================================================
       PAGE STATE
       ========================================================= */

    let currentEventName = "";
    let currentLocation = "";

    let currentJudges = [];

    let editingJudgeRow = null;


    /* =========================================================
       DELAY HELPER
       ========================================================= */

    function sleep(milliseconds) {

      return new Promise(resolve => {
        setTimeout(resolve, milliseconds);
      });

    }


    /* =========================================================
       READ GOOGLE SHEET
       ========================================================= */

    function getSheetData(gid) {

      const cacheBuster = Date.now();

      const url =
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${gid}&tqx=out:json&_=${cacheBuster}`;

      return fetch(url, {
        cache: "no-store"
      })
        .then(response => {

          if (!response.ok) {
            throw new Error("Could not load sheet data.");
          }

          return response.text();

        })
        .then(text => {

          const start = text.indexOf("{");
          const end = text.lastIndexOf("}") + 1;

          if (start === -1 || end === 0) {
            throw new Error(
              "Invalid response from Google Sheets."
            );
          }

          return JSON.parse(
            text.substring(start, end)
          );

        });

    }


    /* =========================================================
       SEND ADMIN ACTION
       ========================================================= */

    function sendAdminAction(data) {

      const body =
        JSON.stringify(data);


      /*
         sendBeacon sends the request without requiring CORS
         permission from Apps Script.
      */

      if (navigator.sendBeacon) {

        const blob = new Blob(
          [body],
          {
            type: "text/plain;charset=UTF-8"
          }
        );

        const sent =
          navigator.sendBeacon(
            APPS_SCRIPT_URL,
            blob
          );

        if (sent) {
          return Promise.resolve();
        }

      }


      /*
         Fallback for browsers where sendBeacon is unavailable.
      */

      return fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },
        body: body
      });

    }


    /* =========================================================
       LOAD EVENT CONFIGURATION
       ========================================================= */

    function loadEventConfig() {

      return getSheetData(EVENT_CONFIG_GID)
        .then(sheetData => {

          const cfg = {};

          sheetData.table.rows.forEach(row => {

            if (!row.c) {
              return;
            }

            const key =
              row.c[0] && row.c[0].v !== null
                ? String(row.c[0].v).trim()
                : "";

            const value =
              row.c[1] && row.c[1].v !== null
                ? String(row.c[1].v).trim()
                : "";

            if (key) {
              cfg[key] = value;
            }

          });


          /* Check Admin Token */

          if (
            !adminToken ||
            cfg.AdminToken !== adminToken
          ) {
            throw new Error("Access denied.");
          }


          /* Store current values */

          currentEventName =
            cfg.EventName || "";

          currentLocation =
            cfg.Location || "";


          /* Display Event Name */

          document
            .getElementById("eventName")
            .textContent =
              currentEventName || "—";


          /* Display Location */

          document
            .getElementById("eventLocation")
            .textContent =
              currentLocation || "—";


          /* Display Current Round */

          document
            .getElementById("eventRound")
            .textContent =
              cfg.Round || "—";


          /* Display Round Status */

          const roundOpen =
            (cfg.RoundOpen || "").toUpperCase();

          const roundStatus =
            document.getElementById("roundStatus");

          if (roundOpen === "YES") {

            roundStatus.textContent =
              "● OPEN";

            roundStatus.className =
              "value status-open";

          } else {

            roundStatus.textContent =
              "● CLOSED";

            roundStatus.className =
              "value status-closed";

          }


          /* Display Panel Insights */

          const insights =
            (cfg.PanelInsights || "").toUpperCase();

          const insightsStatus =
            document.getElementById("panelInsights");

          if (insights === "YES") {

            insightsStatus.textContent =
              "ON";

            insightsStatus.className =
              "value status-yes";

          } else {

            insightsStatus.textContent =
              "OFF";

            insightsStatus.className =
              "value status-no";

          }


          /* Show page after authentication */

          document
            .getElementById("adminContent")
            .style.display =
              "block";

        });

    }


    /* =========================================================
       LOAD JUDGES
       ========================================================= */

    function loadJudges() {

      return getSheetData(JUDGES_GID)
        .then(sheetData => {

          const judgesDiv =
            document.getElementById("judges");

          judgesDiv.innerHTML = "";

          currentJudges = [];


          sheetData.table.rows.forEach(
            (row, index) => {

              if (!row.c) {
                return;
              }


              /*
                 Google Visualization rows begin with the first
                 spreadsheet row, so index + 1 is the actual
                 sheet row number.
              */

              const sheetRow =
                index + 1;


              /*
                 Judges sheet:

                 A = JudgeName
                 B = JudgeToken
                 C = JudgeActive
                 D = ScoreboardID

                 E is deliberately ignored.
              */

              const name =
                row.c[0] &&
                row.c[0].v !== null
                  ? String(row.c[0].v).trim()
                  : "";

              const token =
                row.c[1] &&
                row.c[1].v !== null
                  ? String(row.c[1].v).trim()
                  : "";

              const active =
                row.c[2] &&
                row.c[2].v !== null
                  ? String(row.c[2].v)
                      .trim()
                      .toUpperCase()
                  : "";

              const scoreboardID =
                row.c[3] &&
                row.c[3].v !== null
                  ? String(row.c[3].v).trim()
                  : "";


              /* Ignore header row */

              const nameUpper =
                name.toUpperCase();

              const idUpper =
                scoreboardID.toUpperCase();

              if (
                nameUpper === "JUDGENAME" ||
                nameUpper === "JUDGE NAME" ||
                idUpper === "SCOREBOARDID" ||
                idUpper === "SCOREBOARD ID"
              ) {
                return;
              }


              /* Ignore completely empty rows */

              if (
                !name &&
                !token &&
                !scoreboardID
              ) {
                return;
              }


              const judge = {
                sheetRow: sheetRow,
                name: name,
                token: token,
                active: active,
                scoreboardID: scoreboardID
              };

              currentJudges.push(judge);


              /* Create visible judge row */

              const judgeRow =
                document.createElement("div");

              judgeRow.className =
                "judge";


              const idElement =
                document.createElement("div");

              idElement.className =
                "judge-number";

              idElement.textContent =
                scoreboardID || "—";


              const nameElement =
                document.createElement("div");

              nameElement.textContent =
                name || "Unnamed Judge";


              const statusElement =
                document.createElement("div");

              statusElement.className =
                "judge-status";

              if (active === "YES") {

                statusElement.textContent =
                  "ACTIVE";

                statusElement.classList.add(
                  "status-yes"
                );

              } else {

                statusElement.textContent =
                  "INACTIVE";

                statusElement.classList.add(
                  "status-no"
                );

              }


              const editButton =
                document.createElement("button");

              editButton.type =
                "button";

              editButton.className =
                "judge-edit-button";

              editButton.textContent =
                "Edit";

              editButton.addEventListener(
                "click",
                () => openJudgeEditor(judge)
              );


              judgeRow.appendChild(idElement);
              judgeRow.appendChild(nameElement);
              judgeRow.appendChild(statusElement);
              judgeRow.appendChild(editButton);

              judgesDiv.appendChild(judgeRow);

            }
          );


          if (!currentJudges.length) {

            judgesDiv.textContent =
              "No judges configured.";

          }

        })
        .catch(() => {

          document
            .getElementById("judges")
            .textContent =
              "Could not load judges.";

        });

    }


    /* =========================================================
       OPEN JUDGE EDITOR
       ========================================================= */

    function openJudgeEditor(judge) {

      editingJudgeRow =
        judge.sheetRow;

      document
        .getElementById("judgeNameInput")
        .value =
          judge.name;

      document
        .getElementById("judgeTokenInput")
        .value =
          judge.token;

      document
        .getElementById("judgeActiveInput")
        .value =
          judge.active === "NO"
            ? "NO"
            : "YES";

      document
        .getElementById("scoreboardIDInput")
        .value =
          judge.scoreboardID;

      document
        .getElementById("judgeSaveMessage")
        .textContent =
          "";

      document
        .getElementById("judgeEditor")
        .classList.remove("hidden");

      document
        .getElementById("judgeNameInput")
        .focus();

      document
        .getElementById("judgeEditor")
        .scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });

    }


    /* =========================================================
       CANCEL JUDGE EDIT
       ========================================================= */

    document
      .getElementById("cancelJudgeButton")
      .addEventListener("click", () => {

        editingJudgeRow = null;

        document
          .getElementById("judgeEditor")
          .classList.add("hidden");

        document
          .getElementById("judgeSaveMessage")
          .textContent =
            "";

      });


    /* =========================================================
       SAVE JUDGE
       ========================================================= */

    document
      .getElementById("saveJudgeButton")
      .addEventListener("click", async () => {

        const message =
          document.getElementById(
            "judgeSaveMessage"
          );

        const saveButton =
          document.getElementById(
            "saveJudgeButton"
          );

        const judgeName =
          document
            .getElementById("judgeNameInput")
            .value
            .trim();

        const judgeToken =
          document
            .getElementById("judgeTokenInput")
            .value
            .trim();

        const judgeActive =
          document
            .getElementById("judgeActiveInput")
            .value
            .trim()
            .toUpperCase();

        const scoreboardID =
          document
            .getElementById("scoreboardIDInput")
            .value
            .trim();


        message.textContent =
          "";

        message.className =
          "judge-message";


        if (!editingJudgeRow) {

          message.textContent =
            "No judge is selected.";

          message.classList.add("save-error");

          return;
        }

        if (!judgeName) {

          message.textContent =
            "Judge Name cannot be empty.";

          message.classList.add("save-error");

          return;
        }

        if (!judgeToken) {

          message.textContent =
            "Judge Token cannot be empty.";

          message.classList.add("save-error");

          return;
        }

        if (!scoreboardID) {

          message.textContent =
            "Scoreboard ID cannot be empty.";

          message.classList.add("save-error");

          return;
        }


        saveButton.disabled = true;

        saveButton.textContent =
          "Saving...";


        try {

          /*
             Send update to Apps Script.

             Apps Script writes only columns A-D.
             Column E is never included.
          */

          await sendAdminAction({
            action: "updateJudgeDetails",
            adminToken: adminToken,
            sheetRow: editingJudgeRow,
            judgeName: judgeName,
            judgeToken: judgeToken,
            judgeActive: judgeActive,
            scoreboardID: scoreboardID
          });


          /*
             Allow Apps Script and Sheets time to complete
             the write, then re-read and verify.
          */

          let saved =
            false;

          for (
            let attempt = 0;
            attempt < 5;
            attempt++
          ) {

            await sleep(1000);

            await loadJudges();

            const confirmed =
              currentJudges.find(
                judge =>
                  judge.sheetRow === editingJudgeRow
              );

            if (
              confirmed &&
              confirmed.name === judgeName &&
              confirmed.token === judgeToken &&
              confirmed.active === judgeActive &&
              confirmed.scoreboardID === scoreboardID
            ) {
              saved = true;
              break;
            }

          }


          if (!saved) {
            throw new Error(
              "The sheet did not confirm the judge changes."
            );
          }


          message.textContent =
            "Judge details saved successfully.";

          message.className =
            "judge-message success-message";

          editingJudgeRow = null;

          setTimeout(() => {

            document
              .getElementById("judgeEditor")
              .classList.add("hidden");

          }, 700);


        } catch (err) {

          message.textContent =
            "Could not save judge: " +
            (
              err.message ||
              String(err)
            );

          message.className =
            "judge-message save-error";

        } finally {

          saveButton.disabled =
            false;

          saveButton.textContent =
            "Save Judge";

        }

      });


    /* =========================================================
       OPEN COMPETITION EDIT MODE
       ========================================================= */

    document
      .getElementById("editCompetitionButton")
      .addEventListener("click", () => {

        document
          .getElementById("eventNameInput")
          .value =
            currentEventName;

        document
          .getElementById("eventLocationInput")
          .value =
            currentLocation;

        document
          .getElementById("saveError")
          .textContent =
            "";

        document
          .getElementById("successMessage")
          .textContent =
            "";

        document
          .getElementById("competitionReadMode")
          .classList.add("hidden");

        document
          .getElementById("competitionEditMode")
          .classList.remove("hidden");

        document
          .getElementById("eventNameInput")
          .focus();

      });


    /* =========================================================
       CANCEL COMPETITION EDIT MODE
       ========================================================= */

    document
      .getElementById("cancelCompetitionButton")
      .addEventListener("click", () => {

        document
          .getElementById("competitionEditMode")
          .classList.add("hidden");

        document
          .getElementById("competitionReadMode")
          .classList.remove("hidden");

        document
          .getElementById("saveError")
          .textContent =
            "";

      });


    /* =========================================================
       SAVE COMPETITION DETAILS
       ========================================================= */

    document
      .getElementById("saveCompetitionButton")
      .addEventListener("click", async () => {

        const newEventName =
          document
            .getElementById("eventNameInput")
            .value
            .trim();

        const newLocation =
          document
            .getElementById("eventLocationInput")
            .value
            .trim();

        const saveButton =
          document.getElementById(
            "saveCompetitionButton"
          );

        const saveError =
          document.getElementById(
            "saveError"
          );

        const successMessage =
          document.getElementById(
            "successMessage"
          );


        saveError.textContent =
          "";

        successMessage.textContent =
          "";


        if (!newEventName) {

          saveError.textContent =
            "Event Name cannot be empty.";

          return;
        }

        if (!newLocation) {

          saveError.textContent =
            "Location cannot be empty.";

          return;
        }


        saveButton.disabled =
          true;

        saveButton.textContent =
          "Saving...";


        try {

          await sendAdminAction({
            action: "updateCompetitionDetails",
            adminToken: adminToken,
            eventName: newEventName,
            location: newLocation
          });


          let saved =
            false;

          for (
            let attempt = 0;
            attempt < 5;
            attempt++
          ) {

            await sleep(1000);

            await loadEventConfig();

            if (
              currentEventName === newEventName &&
              currentLocation === newLocation
            ) {
              saved = true;
              break;
            }

          }


          if (!saved) {

            throw new Error(
              "The update was sent, but the sheet did not confirm the changes."
            );

          }


          document
            .getElementById("competitionEditMode")
            .classList.add("hidden");

          document
            .getElementById("competitionReadMode")
            .classList.remove("hidden");


          successMessage.textContent =
            "Competition details saved successfully.";


        } catch (err) {

          saveError.textContent =
            "Could not save changes: " +
            (
              err.message ||
              String(err)
            );

        } finally {

          saveButton.disabled =
            false;

          saveButton.textContent =
            "Save Changes";

        }

      });


    /* =========================================================
       INITIAL PAGE LOAD
       ========================================================= */

    loadEventConfig()
      .then(() => loadJudges())
      .catch(err => {

        document
          .getElementById("error")
          .textContent =
            err.message ||
            "Could not load the Admin Panel.";

      });

  </script>

</body>
</html>
