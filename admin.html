<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1"
  >

  <title>CP Freestyle - Admin Panel</title>

  <style>

    :root {
      --bg: #101216;
      --panel: #1b1f26;
      --panel2: #242a33;
      --border: #343b45;
      --text: #f4f6f8;
      --muted: #aeb7c2;
      --accent: #3b82c4;
      --green: #67d7a2;
      --purple: #7650a8;
      --danger: #ef5b62;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 12px 18px 30px;
    }

    .hidden {
      display: none !important;
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .page-header {
      padding: 0 0 16px;
    }

    .page-header h1 {
      margin: 0;
      font-size: 23px;
      letter-spacing: 0.2px;
    }

    .page-header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }


    /* =========================================================
       LOGIN
       ========================================================= */

    .login-box {
      max-width: 430px;
      margin: 55px auto;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .login-box h2 {
      margin: 0 0 20px;
      font-size: 21px;
    }


    /* =========================================================
       PANELS
       ========================================================= */

    .panel {
      margin-bottom: 16px;
      padding: 18px;
      background: var(--panel);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.02);
    }

    .panel h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }


    /* =========================================================
       COMPETITION OVERVIEW
       ========================================================= */

    .overview-row {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 18px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }

    .overview-label {
      color: var(--muted);
      font-size: 14px;
    }

    .overview-value {
      text-align: right;
      font-size: 14px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .status-open {
      color: var(--green);
    }

    .status-closed {
      color: var(--danger);
    }

    .panel-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }


    /* =========================================================
       JUDGES TABLE
       ========================================================= */

    .judge-table {
      width: 100%;
      border-collapse: collapse;
    }

    .judge-table th {
      padding: 9px 0;
      text-align: left;
      color: var(--muted);
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }

    .judge-table td {
      padding: 10px 0;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .judge-table th:nth-child(3),
    .judge-table td:nth-child(3) {
      text-align: center;
    }

    .judge-table th:last-child,
    .judge-table td:last-child {
      text-align: right;
    }

    .judge-slot {
      font-weight: bold;
      width: 88px;
    }

    .judge-status-active {
      color: var(--green);
      font-weight: bold;
      font-size: 13px;
    }

    .judge-status-inactive {
      color: var(--muted);
      font-weight: bold;
      font-size: 13px;
    }

    .judge-actions {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
      flex-wrap: wrap;
    }


    /* =========================================================
       BUTTONS
       ========================================================= */

    button {
      border: none;
      border-radius: 7px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
    }

    .btn-copy {
      background: #315f92;
    }

    .btn-qr {
      background: #573681;
    }

    .btn-edit {
      background: #30343a;
    }

    .btn-save {
      background: #29985a;
      color: #ffffff;
    }

    .btn-cancel {
      background: #30343a;
    }


    /* =========================================================
       FORMS
       ========================================================= */

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .button-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }


    /* =========================================================
       MODALS
       ========================================================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,0.72);
    }

    .modal {
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .modal h2 {
      margin: 0 0 20px;
      font-size: 20px;
    }

    .qr-modal {
      max-width: 430px;
      text-align: center;
    }

    .qr-modal img {
      width: min(280px, 100%);
      margin: 10px auto 16px;
      padding: 10px;
      background: white;
      border-radius: 8px;
    }

    .qr-url {
      margin-top: 12px;
      padding: 10px;
      background: var(--panel2);
      color: var(--muted);
      border-radius: 7px;
      font-size: 12px;
      overflow-wrap: anywhere;
    }


    /* =========================================================
       STATUS
       ========================================================= */

    .status-message {
      display: none;
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 8px;
      font-size: 14px;
    }

    .status-success {
      display: block;
      background: rgba(53,196,106,0.14);
      border: 1px solid rgba(53,196,106,0.45);
      color: #7ae9a0;
    }

    .status-error {
      display: block;
      background: rgba(239,91,98,0.14);
      border: 1px solid rgba(239,91,98,0.45);
      color: #ffa0a5;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 650px) {

      .container {
        padding: 12px;
      }

      .overview-row {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .overview-value {
        text-align: left;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full-width {
        grid-column: auto;
      }

      .judge-table thead {
        display: none;
      }

      .judge-table,
      .judge-table tbody,
      .judge-table tr,
      .judge-table td {
        display: block;
        width: 100%;
      }

      .judge-table tr {
        padding: 13px 0;
        border-bottom: 1px solid var(--border);
      }

      .judge-table td {
        padding: 4px 0;
        border: none;
        text-align: left !important;
      }

      .judge-table td:nth-child(3) {
        margin-top: 5px;
      }

      .judge-actions {
        justify-content: flex-start;
        margin-top: 8px;
      }

    }

  </style>
</head>


<body>


  <!-- =======================================================
       LOGIN
       ======================================================== -->

  <div
    id="loginSection"
    class="container"
  >

    <div class="page-header">
      <h1>CP Freestyle – Admin Panel</h1>
      <p>Competition setup overview</p>
    </div>

    <div class="login-box">

      <h2>Admin Access</h2>

      <label for="adminToken">
        Admin Token
      </label>

      <input
        id="adminToken"
        type="password"
        placeholder="Enter Admin Token"
        autocomplete="current-password"
      >

      <div class="button-row">
        <button
          class="btn-primary"
          onclick="login()"
        >
          Enter Admin Panel
        </button>
      </div>

      <div
        id="loginStatus"
        class="status-message"
      ></div>

    </div>

  </div>


  <!-- =======================================================
       ADMIN PANEL
       ======================================================== -->

  <div
    id="adminSection"
    class="container hidden"
  >

    <div class="page-header">
      <h1>CP Freestyle – Admin Panel</h1>
      <p>Competition setup overview</p>
    </div>


    <!-- COMPETITION -->

    <div class="panel">

      <h2>Competition</h2>

      <div class="overview-row">
        <div class="overview-label">Event Name</div>
        <div
          id="overviewEventName"
          class="overview-value"
        ></div>
      </div>

      <div class="overview-row">
        <div class="overview-label">Location</div>
        <div
          id="overviewLocation"
          class="overview-value"
        ></div>
      </div>

      <div class="overview-row">
        <div class="overview-label">Current Round</div>
        <div
          id="overviewRound"
          class="overview-value"
        ></div>
      </div>

      <div class="overview-row">
        <div class="overview-label">Round Status</div>
        <div
          id="overviewRoundStatus"
          class="overview-value"
        ></div>
      </div>

      <div class="overview-row">
        <div class="overview-label">Panel Insights</div>
        <div
          id="overviewPanelInsights"
          class="overview-value"
        ></div>
      </div>

      <div class="panel-footer">
        <button
          class="btn-edit"
          onclick="openCompetitionModal()"
        >
          Edit Competition Details
        </button>
      </div>

      <div
        id="competitionStatus"
        class="status-message"
      ></div>

    </div>


    <!-- JUDGES -->

    <div class="panel">

      <h2>Judges</h2>

      <table class="judge-table">

        <thead>
          <tr>
            <th>Judge Slot</th>
            <th>Judge Name</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>

        <tbody id="judgesContainer"></tbody>

      </table>

    </div>

  </div>


  <!-- =======================================================
       COMPETITION EDIT MODAL
       ======================================================== -->

  <div
    id="competitionModal"
    class="modal-backdrop hidden"
  >

    <div class="modal">

      <h2>Edit Competition Details</h2>

      <div class="form-grid">

        <div class="form-group full-width">
          <label for="eventName">Event Name</label>
          <input id="eventName" type="text">
        </div>

        <div class="form-group">
          <label for="location">Location</label>
          <input id="location" type="text">
        </div>

        <div class="form-group">
          <label for="roundNumber">Round Number</label>
          <input id="roundNumber" type="text">
        </div>

        <div class="form-group">
          <label for="roundOpen">Round Status</label>

          <select id="roundOpen">
            <option value="YES">YES - Round Open</option>
            <option value="NO">NO - Round Closed</option>
          </select>
        </div>

        <div class="form-group">
          <label for="panelInsights">Panel Insights</label>

          <select id="panelInsights">
            <option value="YES">YES</option>
            <option value="NO">NO</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="liveToken">LiveToken</label>
          <input id="liveToken" type="text">
        </div>

      </div>

      <div class="button-row">

        <button
          class="btn-cancel"
          onclick="closeCompetitionModal()"
        >
          Cancel
        </button>

        <button
          id="saveCompetitionButton"
          class="btn-save"
          onclick="saveCompetitionSettings()"
        >
          Save Competition Details
        </button>

      </div>

    </div>

  </div>


  <!-- =======================================================
       JUDGE EDIT MODAL
       ======================================================== -->

  <div
    id="judgeModal"
    class="modal-backdrop hidden"
  >

    <div class="modal">

      <h2 id="judgeModalTitle">
        Edit Judge
      </h2>

      <input
        id="editingJudgeRow"
        type="hidden"
      >

      <div class="form-grid">

        <div>
          <label for="judgeName">Judge Name</label>
          <input id="judgeName" type="text">
        </div>

        <div>
          <label for="judgeToken">Judge Token</label>
          <input id="judgeToken" type="text">
        </div>

        <div>
          <label for="judgeActive">Judge Active</label>

          <select id="judgeActive">
            <option value="YES">YES - Active</option>
            <option value="NO">NO - Inactive</option>
          </select>
        </div>

        <div>
          <label for="scoreboardID">
            Judge Slot / Scoreboard ID
          </label>
          <input id="scoreboardID" type="text">
        </div>

      </div>

      <div class="button-row">

        <button
          class="btn-cancel"
          onclick="closeJudgeModal()"
        >
          Cancel
        </button>

        <button
          id="saveJudgeButton"
          class="btn-save"
          onclick="saveEditedJudge()"
        >
          Save Judge
        </button>

      </div>

      <div
        id="judgeEditStatus"
        class="status-message"
      ></div>

    </div>

  </div>


  <!-- =======================================================
       QR MODAL
       ======================================================== -->

  <div
    id="qrModal"
    class="modal-backdrop hidden"
  >

    <div class="modal qr-modal">

      <h2 id="qrTitle">Judge QR Code</h2>

      <img
        id="qrImage"
        alt="Judge QR Code"
      >

      <div
        id="qrUrl"
        class="qr-url"
      ></div>

      <div class="button-row">
        <button
          class="btn-cancel"
          onclick="closeQrModal()"
        >
          Close
        </button>
      </div>

    </div>

  </div>


  <script>

    // =========================================================
    // GOOGLE APPS SCRIPT WEB APP
    // =========================================================

    const WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbx9xfxW7hyAT-3A5viq0REB2MKw4JAuBjUN4_YfHaE-kIV-G-7oLUvvaiLMtZhzYrr_/exec";


    // =========================================================
    // APPLICATION STATE
    // =========================================================

    let ADMIN_TOKEN = "";
    let CURRENT_CONFIG = {};
    let CURRENT_JUDGES = [];


    // =========================================================
    // LOGIN
    // =========================================================

    async function login() {

      const token =
        document
          .getElementById("adminToken")
          .value
          .trim();

      if (!token) {

        showStatus(
          "loginStatus",
          "Please enter the Admin Token.",
          false
        );

        return;
      }

      ADMIN_TOKEN = token;

      showStatus(
        "loginStatus",
        "Loading competition settings...",
        true
      );

      try {

        await loadAdminData();

        document
          .getElementById("loginSection")
          .classList
          .add("hidden");

        document
          .getElementById("adminSection")
          .classList
          .remove("hidden");

      } catch (error) {

        ADMIN_TOKEN = "";

        showStatus(
          "loginStatus",
          error.message ||
            "Unable to load the Admin Panel.",
          false
        );

      }

    }


    document
      .getElementById("adminToken")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            login();
          }

        }
      );


    // =========================================================
    // LOAD ADMIN DATA
    // =========================================================

    async function loadAdminData() {

      const response =
        await apiRequest({
          action: "getAdminData"
        });

      if (!response.ok) {

        throw new Error(
          response.error ||
            "Unable to load admin data."
        );

      }

      CURRENT_CONFIG =
        response.config || {};

      CURRENT_JUDGES =
        response.judges || [];

      renderCompetitionOverview();
      renderJudges();

    }


    // =========================================================
    // COMPETITION OVERVIEW
    // =========================================================

    function renderCompetitionOverview() {

      setText(
        "overviewEventName",
        CURRENT_CONFIG.EventName || ""
      );

      setText(
        "overviewLocation",
        CURRENT_CONFIG.Location || ""
      );

      setText(
        "overviewRound",
        CURRENT_CONFIG.RoundNumber ||
        CURRENT_CONFIG.Round ||
        ""
      );


      const roundOpen =
        String(
          CURRENT_CONFIG.RoundOpen || ""
        )
        .trim()
        .toUpperCase();

      const roundElement =
        document.getElementById(
          "overviewRoundStatus"
        );

      if (roundOpen === "YES") {

        roundElement.textContent =
          "● OPEN";

        roundElement.className =
          "overview-value status-open";

      } else {

        roundElement.textContent =
          "CLOSED";

        roundElement.className =
          "overview-value status-closed";

      }


      const insights =
        String(
          CURRENT_CONFIG.PanelInsights || ""
        )
        .trim()
        .toUpperCase();

      setText(
        "overviewPanelInsights",
        insights === "YES"
          ? "ON"
          : "OFF"
      );

    }


    // =========================================================
    // COMPETITION EDIT
    // =========================================================

    function openCompetitionModal() {

      document
        .getElementById("eventName")
        .value =
          CURRENT_CONFIG.EventName || "";

      document
        .getElementById("location")
        .value =
          CURRENT_CONFIG.Location || "";

      document
        .getElementById("roundNumber")
        .value =
          CURRENT_CONFIG.RoundNumber ||
          CURRENT_CONFIG.Round ||
          "";

      setYesNoValue(
        "roundOpen",
        CURRENT_CONFIG.RoundOpen
      );

      setYesNoValue(
        "panelInsights",
        CURRENT_CONFIG.PanelInsights
      );

      document
        .getElementById("liveToken")
        .value =
          CURRENT_CONFIG.LiveToken || "";

      document
        .getElementById("competitionModal")
        .classList
        .remove("hidden");

    }


    function closeCompetitionModal() {

      document
        .getElementById("competitionModal")
        .classList
        .add("hidden");

    }


    async function saveCompetitionSettings() {

      const button =
        document.getElementById(
          "saveCompetitionButton"
        );

      button.disabled = true;
      button.textContent = "Saving...";

      try {

        const response =
          await apiRequest({

            action:
              "updateCompetitionDetails",

            eventName:
              document
                .getElementById("eventName")
                .value
                .trim(),

            location:
              document
                .getElementById("location")
                .value
                .trim(),

            roundNumber:
              document
                .getElementById("roundNumber")
                .value
                .trim(),

            round:
              document
                .getElementById("roundNumber")
                .value
                .trim(),

            roundOpen:
              document
                .getElementById("roundOpen")
                .value,

            panelInsights:
              document
                .getElementById("panelInsights")
                .value,

            liveToken:
              document
                .getElementById("liveToken")
                .value
                .trim()

          });


        if (!response.ok) {

          throw new Error(
            response.error ||
              "Unable to save competition settings."
          );

        }

        await loadAdminData();

        closeCompetitionModal();

        showStatus(
          "competitionStatus",
          "Competition details saved successfully.",
          true
        );

      } catch (error) {

        showStatus(
          "competitionStatus",
          error.message ||
            "Unable to save competition settings.",
          false
        );

      } finally {

        button.disabled = false;
        button.textContent =
          "Save Competition Details";

      }

    }


    // =========================================================
    // JUDGES
    // =========================================================

    function renderJudges() {

      const container =
        document.getElementById(
          "judgesContainer"
        );

      container.innerHTML = "";

      for (
        let sheetRow = 2;
        sheetRow <= 6;
        sheetRow++
      ) {

        const judge =
          getJudgeForRow(sheetRow);

        const active =
          String(
            judge.judgeActive || ""
          )
          .toUpperCase() === "YES";

        const row =
          document.createElement("tr");

        row.innerHTML = `

          <td class="judge-slot">
            ${escapeHtml(
              judge.scoreboardID ||
              "J" + (sheetRow - 1)
            )}
          </td>

          <td>
            ${escapeHtml(
              judge.judgeName || ""
            )}
          </td>

          <td>
            <span class="${
              active
                ? "judge-status-active"
                : "judge-status-inactive"
            }">
              ${
                active
                  ? "ACTIVE"
                  : "INACTIVE"
              }
            </span>
          </td>

          <td>
            <div class="judge-actions">

              <button
                class="btn-copy"
                onclick="copyJudgeUrl(${sheetRow})"
              >
                Copy URL
              </button>

              <button
                class="btn-qr"
                onclick="showJudgeQr(${sheetRow})"
              >
                QR
              </button>

              <button
                class="btn-edit"
                onclick="openJudgeModal(${sheetRow})"
              >
                Edit
              </button>

            </div>
          </td>

        `;

        container.appendChild(row);

      }

    }


    function getJudgeForRow(sheetRow) {

      return (
        CURRENT_JUDGES.find(
          function(item) {

            return Number(
              item.sheetRow
            ) === sheetRow;

          }
        )
        ||
        {
          sheetRow: sheetRow,
          judgeName: "",
          judgeToken: "",
          judgeActive: "NO",
          scoreboardID:
            "J" + (sheetRow - 1)
        }
      );

    }


    // =========================================================
    // JUDGE URL
    //
    // IMPORTANT:
    // The Judge Token remains embedded in the Judge URL.
    // If the backend provides an existing URL, use it exactly.
    // =========================================================

    function buildJudgeUrl(judge) {

      if (judge.judgeUrl) {
        return judge.judgeUrl;
      }

      if (judge.url) {
        return judge.url;
      }

      const judgePage =
        new URL(
          "index.html",
          window.location.href
        );

      judgePage.searchParams.set(
        "token",
        judge.judgeToken || ""
      );

      return judgePage.toString();

    }


    async function copyJudgeUrl(sheetRow) {

      const judge =
        getJudgeForRow(sheetRow);

      const url =
        buildJudgeUrl(judge);

      try {

        await navigator.clipboard.writeText(
          url
        );

        alert(
          "Judge URL copied to clipboard."
        );

      } catch (error) {

        prompt(
          "Copy this Judge URL:",
          url
        );

      }

    }


    function showJudgeQr(sheetRow) {

      const judge =
        getJudgeForRow(sheetRow);

      const url =
        buildJudgeUrl(judge);

      document
        .getElementById("qrTitle")
        .textContent =
          (judge.judgeName || "Judge") +
          " – Judge QR Code";

      document
        .getElementById("qrUrl")
        .textContent =
          url;

      document
        .getElementById("qrImage")
        .src =
          "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
          encodeURIComponent(url);

      document
        .getElementById("qrModal")
        .classList
        .remove("hidden");

    }


    function closeQrModal() {

      document
        .getElementById("qrModal")
        .classList
        .add("hidden");

    }


    // =========================================================
    // JUDGE EDIT
    // =========================================================

    function openJudgeModal(sheetRow) {

      const judge =
        getJudgeForRow(sheetRow);

      document
        .getElementById("editingJudgeRow")
        .value =
          sheetRow;

      document
        .getElementById("judgeModalTitle")
        .textContent =
          "Edit " +
          (
            judge.scoreboardID ||
            "Judge Record " +
            (sheetRow - 1)
          );

      document
        .getElementById("judgeName")
        .value =
          judge.judgeName || "";

      document
        .getElementById("judgeToken")
        .value =
          judge.judgeToken || "";

      setYesNoValue(
        "judgeActive",
        judge.judgeActive
      );

      document
        .getElementById("scoreboardID")
        .value =
          judge.scoreboardID || "";

      clearStatus(
        "judgeEditStatus"
      );

      document
        .getElementById("judgeModal")
        .classList
        .remove("hidden");

    }


    function closeJudgeModal() {

      document
        .getElementById("judgeModal")
        .classList
        .add("hidden");

    }


    async function saveEditedJudge() {

      const sheetRow =
        Number(
          document
            .getElementById(
              "editingJudgeRow"
            )
            .value
        );

      const button =
        document.getElementById(
          "saveJudgeButton"
        );

      button.disabled = true;
      button.textContent = "Saving...";

      clearStatus(
        "judgeEditStatus"
      );

      try {

        const response =
          await apiRequest({

            action:
              "updateJudgeDetails",

            sheetRow:
              sheetRow,

            judgeName:
              document
                .getElementById("judgeName")
                .value
                .trim(),

            judgeToken:
              document
                .getElementById("judgeToken")
                .value
                .trim(),

            judgeActive:
              document
                .getElementById("judgeActive")
                .value,

            scoreboardID:
              document
                .getElementById("scoreboardID")
                .value
                .trim()

          });


        if (!response.ok) {

          throw new Error(
            response.error ||
              "Unable to save this Judge."
          );

        }

        await loadAdminData();

        closeJudgeModal();

      } catch (error) {

        showStatus(
          "judgeEditStatus",
          error.message ||
            "Unable to save this Judge.",
          false
        );

      } finally {

        button.disabled = false;
        button.textContent =
          "Save Judge";

      }

    }


    // =========================================================
    // API REQUEST
    // =========================================================

    async function apiRequest(payload) {

      const requestData = {
        ...payload,
        adminToken: ADMIN_TOKEN
      };

      let response;

      try {

        response =
          await fetch(
            WEB_APP_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify(
                  requestData
                )
            }
          );

      } catch (error) {

        throw new Error(
          "Could not contact the Apps Script Web App."
        );

      }

      const text =
        await response.text();

      let data;

      try {

        data =
          JSON.parse(text);

      } catch (error) {

        throw new Error(
          "The Apps Script server returned an invalid response."
        );

      }

      return data;

    }


    // =========================================================
    // HELPERS
    // =========================================================

    function setYesNoValue(
      elementId,
      value
    ) {

      const normalized =
        String(value || "")
          .trim()
          .toUpperCase();

      document
        .getElementById(elementId)
        .value =
          normalized === "YES"
            ? "YES"
            : "NO";

    }


    function setText(
      elementId,
      value
    ) {

      document
        .getElementById(elementId)
        .textContent =
          value || "";

    }


    function showStatus(
      elementId,
      message,
      success
    ) {

      const element =
        document.getElementById(
          elementId
        );

      if (!element) {
        return;
      }

      element.textContent =
        message;

      element.className =
        success
          ? "status-message status-success"
          : "status-message status-error";

    }


    function clearStatus(
      elementId
    ) {

      const element =
        document.getElementById(
          elementId
        );

      if (!element) {
        return;
      }

      element.textContent = "";
      element.className =
        "status-message";

    }


    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
