<!--
CP Freestyle Judging System
File: admin.html
Version: v1.3 READ ONLY
Notes:
- Read-only competition administration overview
- No changes are made to the Google Sheet
- Uses the existing Google Sheet structure and IDs
- Protected by the existing AdminToken
- Judges sheet column heading row is explicitly ignored
-->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CP Freestyle – Admin Panel</title>

<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0b0b0b;
  color: #fff;
  padding: 20px;
  max-width: 900px;
  margin: auto;
}

h2 {
  margin-bottom: 6px;
}

.subtitle {
  color: #aaa;
  margin-bottom: 20px;
}

.section {
  background: #111;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 20px;
}

.section h3 {
  margin-top: 0;
}

/* ---------- Competition information ---------- */

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 0;
  border-bottom: 1px solid #2a2a2a;
  gap: 20px;
}

.info-row:last-child {
  border-bottom: none;
}

.label {
  color: #aaa;
  font-size: 14px;
}

.value {
  text-align: right;
  font-weight: 600;
}

.status-open,
.status-yes {
  color: #00d26a;
}

.status-closed,
.status-no {
  color: #ff5252;
}

/* ---------- Judges ---------- */

.judge-header,
.judge {
  display: grid;
  grid-template-columns: 160px 1fr 100px;
  gap: 20px;
  align-items: center;
}

.judge-header {
  color: #aaa;
  font-size: 14px;
  font-weight: 600;
  padding: 8px 0 10px;
  border-bottom: 1px solid #2a2a2a;
}

.judge {
  padding: 12px 0;
  border-bottom: 1px solid #2a2a2a;
}

.judge:last-child {
  border-bottom: none;
}

.judge-number {
  font-weight: bold;
  color: #ccc;
}

.judge-name {
  color: #ddd;
}

.judge-status {
  text-align: right;
  font-weight: 500;
}

/* ---------- Messages ---------- */

.error {
  color: #ff5252;
  margin-bottom: 12px;
  font-weight: bold;
}

.loading {
  color: #aaa;
}

/* ---------- Mobile ---------- */

@media (max-width: 600px) {
  body {
    padding: 12px;
  }

  .info-row {
    align-items: flex-start;
    flex-direction: column;
    gap: 3px;
  }

  .value {
    text-align: left;
  }

  .judge-header,
  .judge {
    grid-template-columns: 105px 1fr 75px;
    gap: 8px;
  }

  .judge-header {
    font-size: 12px;
  }
}
</style>
</head>

<body>

<h2>CP Freestyle – Admin Panel</h2>
<div class="subtitle">Competition setup overview</div>

<div id="error" class="error"></div>

<div id="adminContent" style="display:none;">

  <!-- Competition -->
  <div class="section">
    <h3>Competition</h3>

    <div class="info-row">
      <span class="label">Event Name</span>
      <span class="value" id="eventName">—</span>
    </div>

    <div class="info-row">
      <span class="label">Location</span>
      <span class="value" id="eventLocation">—</span>
    </div>

    <div class="info-row">
      <span class="label">Current Round</span>
      <span class="value" id="eventRound">—</span>
    </div>

    <div class="info-row">
      <span class="label">Round Status</span>
      <span class="value" id="roundStatus">—</span>
    </div>

    <div class="info-row">
      <span class="label">Panel Insights</span>
      <span class="value" id="panelInsights">—</span>
    </div>
  </div>

  <!-- Judges -->
  <div class="section">
    <h3>Judges</h3>

    <!-- These are the ADMIN PAGE headings only -->
    <div class="judge-header">
      <div>Scoreboard ID</div>
      <div>Judge Name</div>
      <div style="text-align:right;">Status</div>
    </div>

    <div id="judges" class="loading">Loading judges...</div>
  </div>

</div>

<script>
/* ---------- CONFIG ---------- */

const SHEET_ID = "1v839BJMAiCtXbSwRaS6jDq_oDxZgSYwU5sm4JwzrYUk";
const EVENT_CONFIG_GID = "686531230";
const JUDGES_GID = "1213944419";

/* ---------- AUTH ---------- */

const params = new URLSearchParams(window.location.search);
const adminToken = params.get("token");

/* ---------- HELPER: READ GOOGLE SHEET ---------- */

function getSheetData(gid) {
  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${gid}&tqx=out:json`;

  return fetch(url)
    .then(r => r.text())
    .then(t => {
      return JSON.parse(
        t.substring(t.indexOf("{"), t.lastIndexOf("}") + 1)
      );
    });
}

/* ---------- LOAD EVENT CONFIG ---------- */

getSheetData(EVENT_CONFIG_GID)
  .then(j => {

    const cfg = {};

    j.table.rows.forEach(r => {
      if (r.c && r.c[0] && r.c[1]) {
        const key = String(r.c[0].v).trim();
        const value = String(r.c[1].v).trim();
        cfg[key] = value;
      }
    });

    /*
      Keep exactly the same AdminToken protection used by
      the existing admin page.
    */
    if (!adminToken || cfg.AdminToken !== adminToken) {
      document.getElementById("error").textContent = "Access denied";
      return;
    }

    document.getElementById("adminContent").style.display = "block";

    document.getElementById("eventName").textContent =
      cfg.EventName || "—";

    document.getElementById("eventLocation").textContent =
      cfg.Location || "—";

    document.getElementById("eventRound").textContent =
      cfg.Round || "—";

    const roundOpen = (cfg.RoundOpen || "").toUpperCase();
    const roundStatus = document.getElementById("roundStatus");

    if (roundOpen === "YES") {
      roundStatus.textContent = "● OPEN";
      roundStatus.className = "value status-open";
    } else {
      roundStatus.textContent = "● CLOSED";
      roundStatus.className = "value status-closed";
    }

    const insights = (cfg.PanelInsights || "").toUpperCase();
    const insightsStatus = document.getElementById("panelInsights");

    if (insights === "YES") {
      insightsStatus.textContent = "ON";
      insightsStatus.className = "value status-yes";
    } else {
      insightsStatus.textContent = "OFF";
      insightsStatus.className = "value status-no";
    }

  })
  .catch(err => {
    document.getElementById("error").textContent =
      "Could not load Event Config: " + err;
  });


/* ---------- LOAD JUDGES ---------- */

getSheetData(JUDGES_GID)
  .then(j => {

    const judgesDiv = document.getElementById("judges");
    judgesDiv.innerHTML = "";

    j.table.rows.forEach(r => {

      if (!r.c) return;

      const name =
        r.c[0] ? String(r.c[0].v || "").trim() : "";

      const active =
        r.c[2] ? String(r.c[2].v || "").trim().toUpperCase() : "";

      const judgeNumber =
        r.c[3] ? String(r.c[3].v || "").trim() : "";

      /*
        The Google Sheet's first row contains column headings:
        JudgeName | JudgeToken | JudgeActive | ScoreboardID | Judge URL

        Explicitly ignore that row. This is deliberately based on
        its actual heading text, so it cannot appear as an INACTIVE judge.
      */
      if (
        name.toUpperCase() === "JUDGENAME" ||
        judgeNumber.toUpperCase() === "SCOREBOARDID"
      ) {
        return;
      }

      /* Skip completely empty rows */
      if (!name && !judgeNumber) return;

      const row = document.createElement("div");
      row.className = "judge";

      const number = document.createElement("div");
      number.className = "judge-number";
      number.textContent = judgeNumber || "—";

      const judgeName = document.createElement("div");
      judgeName.className = "judge-name";
      judgeName.textContent = name || "Unnamed Judge";

      const status = document.createElement("div");
      status.className = "judge-status";

      /* Only actual judges reach this point */
      if (active === "YES") {
        status.textContent = "ACTIVE";
        status.classList.add("status-yes");
      } else {
        status.textContent = "INACTIVE";
        status.classList.add("status-no");
      }

      row.appendChild(number);
      row.appendChild(judgeName);
      row.appendChild(status);

      judgesDiv.appendChild(row);
    });

    if (!judgesDiv.innerHTML) {
      judgesDiv.textContent = "No judges configured.";
    }

  })
  .catch(err => {
    document.getElementById("judges").textContent =
      "Could not load judges.";
  });
</script>

</body>
</html>
