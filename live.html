<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CP Freestyle – Live Scoreboard</title>

<style>

body{
font-family:system-ui,sans-serif;
background:#000;
color:#fff;
margin:0;
padding:20px;
text-align:center;
}

/* EVENT HEADER */

.event{
margin-bottom:25px;
padding-bottom:15px;
border-bottom:3px solid #ff7a00;
display:inline-block;
min-width:600px;
}

.event-name{font-size:28px;font-weight:bold;}
.event-location{font-size:16px;color:#bbb;}
.event-round{font-size:18px;color:#aaa;}

/* CURRENT COMPETITOR */

.current{margin-top:30px;}

.comp-number{
font-size:56px;
font-weight:600;
margin-bottom:20px;
transition:opacity .3s ease, transform .3s ease;
}

/* JUDGE HEADER ROW */

.judges{
display:grid;
grid-template-columns:repeat(auto-fit,140px);
justify-content:center;
font-size:30px;
margin-bottom:10px;
}

/* CURRENT SCORES */

.scores{
display:grid;
grid-template-columns:repeat(auto-fit,140px);
justify-content:center;
font-size:78px;
font-weight:bold;
color:#ff7a00;
gap:40px;
margin-top:10px;
}

/* score animation */

.score{
opacity:0;
transform:translateY(8px) scale(0.95);
animation:scoreIn .35s ease forwards, scoreGlow 1s ease;
}

@keyframes scoreIn{
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

@keyframes scoreGlow{
0%{text-shadow:0 0 0px #ff7a00;}
50%{text-shadow:0 0 18px #ff7a00;}
100%{text-shadow:0 0 0px #ff7a00;}
}

.waiting{color:#444}

/* HISTORY */

.history{
margin-top:40px;
font-size:16px;
color:#3cff6a;
line-height:1.4;
}

.history-row{
margin:2px 0;
font-family:monospace;
}

</style>
</head>

<body>

<div class="event">
<div id="eventName" class="event-name"></div>
<div id="eventLocation" class="event-location"></div>
<div id="eventRound" class="event-round"></div>
</div>

<div class="current">

<div id="compNumber" class="comp-number">—</div>

<div id="judgeHeaders" class="judges"></div>
<div id="scoreRow" class="scores"></div>

</div>

<div id="historyContainer" class="history"></div>

<script>

/* DOM ELEMENTS */

const eventNameEl=document.getElementById("eventName");
const eventLocationEl=document.getElementById("eventLocation");
const eventRoundEl=document.getElementById("eventRound");

const compNumberEl=document.getElementById("compNumber");
const judgeHeadersEl=document.getElementById("judgeHeaders");
const scoreRowEl=document.getElementById("scoreRow");

const historyContainer=document.getElementById("historyContainer");

/* CONFIG */

const SHEET_ID="1v839BJMAiCtXbSwRaS6jDq_oDxZgSYwU5sm4JwzrYUk";

const EVENT_CONFIG_GID="686531230";
const COMPETITOR_GID="51112637";
const JUDGES_GID="1213944419";
const RESPONSES_GID="152250623";

const params=new URLSearchParams(location.search);
const tokenParam=params.get("token");

/* STATE */

let state={
round:1,
eventName:"",
location:"",
liveToken:"",
judges:[],
competitors:[],
currentComp:null
};

/* PARSE GOOGLE GVIZ */

function parseGViz(t){
return JSON.parse(t.substring(t.indexOf("{"),t.lastIndexOf("}")+1));
}

/* LOAD EVENT CONFIG */

async function loadEventConfig(){

const r=await fetch(
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${EVENT_CONFIG_GID}&tqx=out:json`
);

const j=parseGViz(await r.text());

const cfg={};

j.table.rows.forEach(row=>{
cfg[row.c[0]?.v]=row.c[1]?.v;
});

state.eventName=cfg.EventName||"";
state.location=cfg.Location||"";
state.round=parseInt(cfg.Round,10)||1;
state.liveToken=cfg.LiveToken||"";

if(tokenParam!==state.liveToken){
document.body.innerHTML="<h1>Access denied</h1>";
throw new Error("Bad token");
}

eventNameEl.textContent=state.eventName;
eventLocationEl.textContent=state.location;
eventRoundEl.textContent=`Round ${state.round}`;

}

/* LOAD JUDGES */

async function loadJudges(){

const r=await fetch(
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${JUDGES_GID}&tqx=out:json`
);

const j=parseGViz(await r.text());

state.judges=[];

j.table.rows.forEach(row=>{

const active=String(row.c[2]?.v).toUpperCase();
const scoreboardID=row.c[3]?.v;

if(active==="YES" && scoreboardID){
state.judges.push(scoreboardID);
}

});

renderJudgeHeaders();

}

function renderJudgeHeaders(){

judgeHeadersEl.innerHTML="";

state.judges.forEach(j=>{

const div=document.createElement("div");
div.textContent=j;
judgeHeadersEl.appendChild(div);

});

}

/* LOAD COMPETITORS */

async function loadCompetitors(){

const r=await fetch(
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${COMPETITOR_GID}&tqx=out:json`
);

const j=parseGViz(await r.text());

state.competitors=j.table.rows.map(row=>({

order:Number(row.c[0]?.v||0),
number:String(row.c[1]?.v),
name:row.c[2]?.v||""

})).sort((a,b)=>a.order-b.order);

}

/* POLL RESPONSES */

async function pollResponses(){

const r=await fetch(
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${RESPONSES_GID}&tqx=out:json`
);

const j=parseGViz(await r.text());

const headers=j.table.cols.map(c=>c.label.trim().toLowerCase().replace(/\s+/g,""));
const h=Object.fromEntries(headers.map((k,i)=>[k,i]));

const judgeCol=h["judgeid"];
const compCol=h["competitornumber"];
const scoreCol=h["score"];
const roundCol=h["round"];

const scores={};

j.table.rows.forEach(row=>{

const round=row.c[roundCol]?.v;
if(String(round)!==String(state.round)) return;

let judgeFull=row.c[judgeCol]?.v;
let comp=String(row.c[compCol]?.v);
const score=row.c[scoreCol]?.v;

if(!judgeFull) return;

/* match judge using ScoreboardID */

const judgeID=state.judges.find(j=>judgeFull.startsWith(j));

if(!judgeID) return;

if(!scores[comp]) scores[comp]={};

scores[comp][judgeID]=parseFloat(score);

});

updateScoreboard(scores);

}

/* SCOREBOARD LOGIC */

function updateScoreboard(scores){

const ordered=state.competitors.map(c=>c.number);

let active=null;

for(let i=ordered.length-1;i>=0;i--){
if(scores[ordered[i]]){
active=ordered[i];
break;
}
}

if(!active) active=ordered[0];

state.currentComp=active;

renderCurrent(scores[active]||{});
buildHistory(scores);

}

/* CURRENT COMPETITOR */

function renderCurrent(scoreObj){

const compObj=state.competitors.find(
c=>c.number===state.currentComp
);

compNumberEl.style.opacity=0;
compNumberEl.style.transform="translateY(-8px)";

setTimeout(()=>{
compNumberEl.textContent=`${compObj.number}  ${compObj.name}`;
compNumberEl.style.opacity=1;
compNumberEl.style.transform="translateY(0)";
},120);

scoreRowEl.innerHTML="";

state.judges.forEach(j=>{

const div=document.createElement("div");

if(scoreObj[j]!==undefined){

div.textContent=scoreObj[j].toFixed(1);
div.className="score";

}else{

div.textContent="—";
div.className="waiting";

}

scoreRowEl.appendChild(div);

});

}

/* HISTORY */

function buildHistory(scores){

historyContainer.innerHTML="";

const currentIndex = state.competitors.findIndex(
c => c.number === state.currentComp
);

if(currentIndex === -1) return;

const previous = state.competitors
.slice(Math.max(0,currentIndex-3),currentIndex)
.reverse();

previous.forEach(c=>{

const row=document.createElement("div");
row.className="history-row";

let scoreText = state.judges.map(j=>{
const s = scores[c.number]?.[j];
return s ? Number(s).toFixed(1) : "—";
}).join(", ");

row.textContent = `${c.number}   ${scoreText}`;

historyContainer.appendChild(row);

});

}

/* BOOT */

async function boot(){

await loadEventConfig();
await loadJudges();
await loadCompetitors();

setInterval(pollResponses,2000);

}

boot();

</script>

</body>
</html>
