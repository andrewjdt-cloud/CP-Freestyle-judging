<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CP Freestyle – Live Scoreboard</title>

<style>

body{
font-family:system-ui,sans-serif;
background:#000;
color:#fff;
margin:0;
padding:20px;
text-align:center;
}

/* HEADER */

.event{margin-bottom:20px;}

.event-name{font-size:28px;font-weight:bold;}
.event-location{font-size:16px;color:#bbb;}
.event-round{font-size:18px;color:#aaa;}

/* CURRENT COMP */

.current{margin-top:30px;}

.comp-number{
font-size:72px;
font-weight:bold;
margin-bottom:25px;
}

/* JUDGE GRID */

.judges{
display:grid;
grid-template-columns:repeat(auto-fit,100px);
justify-content:center;
font-size:30px;
margin-bottom:10px;
}

.scores{
display:grid;
grid-template-columns:repeat(auto-fit,100px);
justify-content:center;
font-size:48px;
font-weight:bold;
color:#ff7a00;
}

/* score animation */

.score{
opacity:0;
transform:translateY(10px);
animation:scoreIn .35s ease forwards;
}

@keyframes scoreIn{
to{opacity:1;transform:translateY(0);}
}

.waiting{color:#444}

/* HISTORY */

.history{
margin-top:40px;
font-size:20px;
color:#bbb;
}

.history-row{
display:grid;
grid-template-columns:80px repeat(auto-fit,100px);
justify-content:center;
margin:6px 0;
}

</style>
</head>

<body>

<div class="event">
<div id="eventName" class="event-name"></div>
<div id="eventLocation" class="event-location"></div>
<div id="eventRound" class="event-round"></div>
</div>

<div class="current">

<div id="compNumber" class="comp-number">—</div>

<div id="judgeHeaders" class="judges"></div>
<div id="scoreRow" class="scores"></div>

</div>

<div id="history" class="history"></div>

<script>

const SHEET_ID="1v839BJMAiCtXbSwRaS6jDq_oDxZgSYwU5sm4JwzrYUk";

const EVENT_CONFIG_GID="686531230";
const COMPETITOR_GID="51112637";
const JUDGES_GID="1213944419";
const RESPONSES_GID="152250623";

const params=new URLSearchParams(location.search);
const tokenParam=params.get("token");

let state={
round:1,
eventName:"",
location:"",
liveToken:"",
judges:[],
competitors:[],
currentComp:null
};

/* ---------- PARSE GOOGLE GVIZ ---------- */

function parseGViz(t){
return JSON.parse(t.substring(t.indexOf("{"),t.lastIndexOf("}")+1));
}

/* ---------- EVENT CONFIG ---------- */

async function loadEventConfig(){

const r=await fetch(
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${EVENT_CONFIG_GID}&tqx=out:json`
);

const j=parseGViz(await r.text());

const cfg={};

j.table.rows.forEach(row=>{
cfg[row.c[0]?.v]=row.c[1]?.v;
});

state.eventName=cfg.EventName||"";
state.location=cfg.Location||"";
state.round=parseInt(cfg.Round,10)||1;
state.liveToken=cfg.LiveToken||"";

if(tokenParam!==state.liveToken){
document.body.innerHTML="<h1>Access denied</h1>";
throw new Error("Bad token");
}

eventName.textContent=state.eventName;
eventLocation.textContent=state.location;
eventRound.textContent=`Round ${state.round}`;

}

/* ---------- JUDGES ---------- */

async function loadJudges(){

const r=await fetch(
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${JUDGES_GID}&tqx=out:json`
);

const j=parseGViz(await r.text());

state.judges=[];

j.table.rows.forEach(row=>{

const active=String(row.c[2]?.v).toUpperCase();
const scoreboardID=row.c[3]?.v;

if(active==="YES" && scoreboardID){
state.judges.push(scoreboardID);
}

});

renderJudgeHeaders();

}

function renderJudgeHeaders(){

judgeHeaders.innerHTML="";

state.judges.forEach(j=>{
const div=document.createElement("div");
div.textContent=j;
judgeHeaders.appendChild(div);
});

}

/* ---------- COMPETITORS ---------- */

async function loadCompetitors(){

const r=await fetch(
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${COMPETITOR_GID}&tqx=out:json`
);

const j=parseGViz(await r.text());

state.competitors=j.table.rows.map(row=>({
order:Number(row.c[0]?.v||0),
number:String(row.c[1]?.v)
})).sort((a,b)=>a.order-b.order);

}

/* ---------- POLL RESPONSES ---------- */

async function pollResponses(){

const r=await fetch(
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${RESPONSES_GID}&tqx=out:json`
);

const j=parseGViz(await r.text());

const headers=j.table.cols.map(c=>c.label.trim().toLowerCase().replace(/\s+/g,""));
const h=Object.fromEntries(headers.map((k,i)=>[k,i]));

const judgeCol=h["judgeid"];
const compCol=h["competitornumber"];
const scoreCol=h["score"];
const roundCol=h["round"];

const scores={};

j.table.rows.forEach(row=>{

const round=row.c[roundCol]?.v;
if(String(round)!==String(state.round)) return;

let judgeFull=row.c[judgeCol]?.v;
let comp=String(row.c[compCol]?.v);
const score=row.c[scoreCol]?.v;

if(!judgeFull) return;

/* match judge to ScoreboardID from judges list */
const judgeID = state.judges.find(j => judgeFull.startsWith(j));

if(!judgeID) return;

if(!scores[comp]) scores[comp]={};

scores[comp][judgeID]=parseFloat(score);

});

updateScoreboard(scores);

}

/* ---------- SCOREBOARD LOGIC ---------- */

function updateScoreboard(scores){

const ordered = state.competitors.map(c => c.number);

/* find most recent competitor that has any score */
let active = null;

for(let i = ordered.length - 1; i >= 0; i--){
if(scores[ordered[i]]){
active = ordered[i];
break;
}
}

/* if nothing scored yet show first competitor */
if(!active){
active = ordered[0];
}

state.currentComp = active;

renderCurrent(scores[active] || {});
buildHistory(scores);

}
  
/* ---------- CURRENT ---------- */

function renderCurrent(scoreObj){

compNumber.textContent=`COMP ${state.currentComp}`;

scoreRow.innerHTML="";

state.judges.forEach(j=>{

const div=document.createElement("div");

if(scoreObj[j]!==undefined){

div.textContent=scoreObj[j].toFixed(1);
div.className="score";

}else{

div.textContent="—";
div.className="waiting";

}

scoreRow.appendChild(div);

});

}

/* ---------- HISTORY ---------- */

console.log("buildHistory called");
  
function buildHistory(scores){

history.innerHTML="";

/* TEMP TEST CONTENT */

const row=document.createElement("div");
row.className="history-row";

row.innerHTML=`
<div>TEST</div>
<div>1.1</div>
<div>2.2</div>
<div>3.3</div>
<div>4.4</div>
<div>5.5</div>
`;

history.appendChild(row);

}
  
/* ---------- BOOT ---------- */

async function boot(){

await loadEventConfig();
await loadJudges();
await loadCompetitors();

setInterval(pollResponses,2000);

}

boot();

</script>
</body>
</html>
