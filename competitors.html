<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CP Freestyle – Competitor Management</title>

<style>
  :root {
    --bg: #0b1018;
    --panel: #151e2a;
    --panel2: #1b2635;
    --border: #2b3a4d;
    --text: #e7edf5;
    --muted: #9aa9bb;
    --green: #42c98a;
    --blue: #5fa8ff;
    --purple: #b67cff;
    --red: #ff6b6b;

    --round1: rgba(151, 74, 103, .45);
    --round1b: rgba(107, 65, 91, .50);

    --round2: rgba(62, 100, 137, .50);
    --round2b: rgba(55, 83, 112, .55);

    --round3: rgba(142, 102, 29, .55);
    --round3b: rgba(111, 78, 25, .58);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
  }

  .page {
    max-width: 1540px;
    margin: 0 auto;
    padding: 22px;
  }

  /* HEADER */

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 16px;
  }

  h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: .2px;
  }

  .subtitle {
    margin-top: 5px;
    color: var(--muted);
    font-size: 14px;
  }

  .back-btn {
    background: #182332;
    color: var(--text);
    border: 1px solid #304158;
    padding: 11px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }

  .back-btn:hover {
    background: #223249;
  }

  /* EVENT SUMMARY */

  .summary {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 0;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .summary-item {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .summary-icon {
    font-size: 22px;
  }

  .summary-label {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 4px;
  }

  .summary-value {
    font-weight: bold;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* MAIN PANEL */

  .main-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .toolbar {
    padding: 10px;
    display: flex;
    gap: 10px;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
  }

  .btn {
    border: 1px solid #34455b;
    background: #1b2635;
    color: var(--text);
    padding: 11px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
  }

  .btn:hover {
    filter: brightness(1.15);
  }

  .btn-add {
    background: #185e48;
    border-color: #287c60;
  }

  .btn-paste {
    background: #244f7b;
    border-color: #3976ad;
  }

  .btn-search {
    margin-left: auto;
    background: #101824;
    border: 1px solid #34455b;
    width: 240px;
    color: var(--text);
    padding: 11px 14px;
    border-radius: 7px;
    outline: none;
  }

  /* TABLE */

  .table-wrap {
    width: 100%;
    overflow-x: auto;
    overflow-y: visible;
    padding: 8px 10px 0;
  }

  table {
    width: 100%;
    min-width: 1450px;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
  }

  th,
  td {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 12px 10px;
    font-size: 13px;
    text-align: left;
    vertical-align: middle;
  }

  th {
    background: #1b2533;
    font-weight: bold;
    color: #d8e1ec;
  }

  tr:first-child th {
    border-top: 1px solid var(--border);
  }

  th:first-child,
  td:first-child {
    border-left: 1px solid var(--border);
  }

  .col-drag {
    width: 42px;
    text-align: center;
  }

  .col-order {
    width: 80px;
    text-align: center;
  }

  .col-number {
    width: 76px;
    text-align: center;
  }

  .col-name {
    width: 210px;
  }

  /* Wider move columns so names don't get chopped */

  .move-col {
    width: 190px;
    white-space: normal;
    line-height: 1.35;
  }

  .actions-col {
    width: 130px;
    text-align: center;
  }

  .round-title {
    text-align: center;
  }

  .r1-title {
    color: #f0b7cf;
  }

  .r2-title {
    color: #a8d2f4;
  }

  .r3-title {
    color: #f2d37d;
  }

  .r1a { background: var(--round1); }
  .r1b { background: var(--round1b); }

  .r2a { background: var(--round2); }
  .r2b { background: var(--round2b); }

  .r3a { background: var(--round3); }
  .r3b { background: var(--round3b); }

  .drag {
    color: #91a2b8;
    font-size: 18px;
    cursor: grab;
  }

  .name-cell {
    font-weight: bold;
  }

  .number-cell,
  .order-cell {
    text-align: center;
    font-weight: bold;
  }

  .action-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .icon-btn {
    width: 38px;
    height: 34px;
    border-radius: 7px;
    border: 1px solid #34455b;
    background: #172231;
    color: var(--text);
    cursor: pointer;
    font-size: 15px;
  }

  .icon-btn:hover {
    background: #243449;
  }

  .delete-btn {
    color: #ff7474;
    border-color: #6d3238;
  }

  /* COMPLETED */

  .completed-row td {
    background: rgba(21, 76, 51, .22);
    color: #a8d9a9;
    border-color: #285b42;
  }

  .completed-row .name-cell,
  .completed-row .order-cell,
  .completed-row .number-cell {
    font-weight: bold;
  }

  .protected {
    text-align: center;
    font-weight: bold;
  }

  .footer-note {
    color: var(--muted);
    text-align: center;
    padding: 13px;
    font-size: 13px;
  }

  .loading,
  .error {
    padding: 45px;
    text-align: center;
    color: var(--muted);
  }

  .error {
    color: #ff8b8b;
  }

  @media (max-width: 700px) {

    .page {
      padding: 12px;
    }

    .topbar {
      flex-direction: column;
    }

    .summary {
      grid-template-columns: 1fr 1fr;
    }

    .btn-search {
      width: 100%;
      margin-left: 0;
    }

    h1 {
      font-size: 22px;
    }
  }
</style>
</head>

<body>

<div class="page">

  <div class="topbar">
    <div>
      <h1>🏆 CP Freestyle – Competitor Management</h1>
      <div class="subtitle">View and manage all competitors for the event</div>
    </div>

    <button class="back-btn" onclick="goBack()">↩ Back to Admin Panel</button>
  </div>

  <!-- EVENT SUMMARY -->

  <div class="summary">

    <div class="summary-item">
      <div class="summary-icon">🗓️</div>
      <div>
        <div class="summary-label">Event Name</div>
        <div class="summary-value" id="eventName">Loading...</div>
      </div>
    </div>

    <div class="summary-item">
      <div class="summary-icon">📍</div>
      <div>
        <div class="summary-label">Location</div>
        <div class="summary-value" id="eventLocation">Loading...</div>
      </div>
    </div>

    <div class="summary-item">
      <div class="summary-icon">👥</div>
      <div>
        <div class="summary-label">Total Competitors</div>
        <div class="summary-value" id="competitorCount">0</div>
      </div>
    </div>

    <div class="summary-item">
      <div class="summary-icon">◷</div>
      <div>
        <div class="summary-label">Last Updated</div>
        <div class="summary-value" id="lastUpdated">Loading...</div>
      </div>
    </div>

  </div>

  <!-- COMPETITOR PANEL -->

  <div class="main-panel">

    <div class="toolbar">
      <button class="btn btn-add" onclick="addCompetitor()">＋ Add Competitor</button>
      <button class="btn btn-paste" onclick="pasteSpreadsheet()">▣ Paste from Spreadsheet</button>
      <button class="btn" onclick="renumberOrder()">⟳ Renumber Order</button>
      <button class="btn" onclick="exportExcel()">⇩ Export to Excel</button>

      <input
        id="searchBox"
        class="btn-search"
        type="text"
        placeholder="⌕ Search name or number..."
        oninput="filterCompetitors()"
      >
    </div>

    <div class="table-wrap" id="tableWrap">
      <div class="loading">Loading competitors...</div>
    </div>

    <div class="footer-note">
      Drag and drop ordering and editing will be connected to the competition management system next.
    </div>

  </div>

</div>

<script>

/* =========================================================
   GOOGLE SHEET SETTINGS
   ========================================================= */

const SPREADSHEET_ID = "1v839BJMAiCtXbSwRaS6jDq_oDxZgSYwU5sm4JwzrYUk";

const COMPETITORS_GID = "51112637";
const EVENT_CONFIG_GID = "686531230";

let competitors = [];


/* =========================================================
   GOOGLE VISUALIZATION FETCH
   ========================================================= */

function sheetUrl(gid) {
  return `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&gid=${gid}`;
}

async function fetchSheet(gid) {

  const response = await fetch(sheetUrl(gid));

  if (!response.ok) {
    throw new Error("Could not access spreadsheet.");
  }

  const text = await response.text();

  const jsonText = text
    .replace(/^[\s\S]*?setResponse\(/, "")
    .replace(/\);?\s*$/, "");

  return JSON.parse(jsonText);
}

function getCellValue(cell) {
  if (!cell) return "";
  return cell.v !== undefined && cell.v !== null ? String(cell.v) : "";
}


/* =========================================================
   LOAD EVENT DETAILS
   ========================================================= */

async function loadEventDetails() {

  try {

    const data = await fetchSheet(EVENT_CONFIG_GID);
    const rows = data.table.rows || [];

    const config = {};

    rows.forEach(row => {

      const key = getCellValue(row.c && row.c[0]).trim();
      const value = getCellValue(row.c && row.c[1]).trim();

      if (key) {
        config[key] = value;
      }

    });

    document.getElementById("eventName").textContent =
      config.EventName || "Not set";

    document.getElementById("eventLocation").textContent =
      config.Location || "Not set";

  } catch (error) {

    console.error("Event details error:", error);

    document.getElementById("eventName").textContent = "Unable to load";
    document.getElementById("eventLocation").textContent = "Unable to load";
  }
}


/* =========================================================
   LOAD COMPETITORS
   ========================================================= */

async function loadCompetitors() {

  try {

    const data = await fetchSheet(COMPETITORS_GID);
    const rows = data.table.rows || [];

    competitors = rows
      .map(row => {

        const cells = row.c || [];

        return {
          order: getCellValue(cells[0]),
          number: getCellValue(cells[1]),
          name: getCellValue(cells[2]),

          r1a: getCellValue(cells[3]),
          r1b: getCellValue(cells[6]),

          r2a: getCellValue(cells[4]),
          r2b: getCellValue(cells[7]),

          r3a: getCellValue(cells[5]),
          r3b: getCellValue(cells[8])
        };

      })
      .filter(c => c.order !== "" || c.number !== "" || c.name !== "");

    /* Sort normal competitors by order and always place
       competitor number 0 / COMPLETED at the bottom. */

    competitors.sort((a, b) => {

      const aComplete = String(a.number) === "0";
      const bComplete = String(b.number) === "0";

      if (aComplete && !bComplete) return 1;
      if (!aComplete && bComplete) return -1;

      return Number(a.order) - Number(b.order);
    });

    const actualCompetitors = competitors.filter(
      c => String(c.number) !== "0"
    );

    document.getElementById("competitorCount").textContent =
      actualCompetitors.length;

    document.getElementById("lastUpdated").textContent =
      new Date().toLocaleString();

    renderTable();

  } catch (error) {

    console.error("Competitor loading error:", error);

    document.getElementById("tableWrap").innerHTML =
      `<div class="error">
        Could not load competitors. Please check that the Competitors sheet is accessible.
      </div>`;
  }
}


/* =========================================================
   RENDER TABLE
   ========================================================= */

function renderTable() {

  const wrap = document.getElementById("tableWrap");

  if (!competitors.length) {
    wrap.innerHTML = `<div class="loading">No competitors found.</div>`;
    return;
  }

  let html = `
    <table id="competitorTable">

      <thead>

        <tr>
          <th class="col-drag" rowspan="2"></th>
          <th class="col-order" rowspan="2">Order ↕</th>
          <th class="col-number" rowspan="2">Number</th>
          <th class="col-name" rowspan="2">↕ Name</th>

          <th class="round-title r1-title" colspan="2">Round 1</th>
          <th class="round-title r2-title" colspan="2">Round 2</th>
          <th class="round-title r3-title" colspan="2">Round 3</th>

          <th class="actions-col" rowspan="2">Actions</th>
        </tr>

        <tr>
          <th class="move-col r1a">A Move</th>
          <th class="move-col r1b">B Move</th>

          <th class="move-col r2a">A Move</th>
          <th class="move-col r2b">B Move</th>

          <th class="move-col r3a">A Move</th>
          <th class="move-col r3b">B Move</th>
        </tr>

      </thead>

      <tbody>
  `;

  competitors.forEach((c, index) => {

    const isCompleted = String(c.number) === "0";

    if (isCompleted) {

      html += `
        <tr class="completed-row">

          <td class="col-drag">▣</td>
          <td class="order-cell">COMPLETE</td>
          <td class="number-cell">0</td>
          <td class="name-cell">COMPLETED</td>

          <td class="r1a">—</td>
          <td class="r1b">—</td>

          <td class="r2a">—</td>
          <td class="r2b">—</td>

          <td class="r3a">—</td>
          <td class="r3b">—</td>

          <td class="protected">🔒 Protected</td>

        </tr>
      `;

    } else {

      html += `
        <tr data-index="${index}">

          <td class="col-drag">
            <span class="drag">⠿</span>
          </td>

          <td class="order-cell">${escapeHtml(c.order)}</td>
          <td class="number-cell">${escapeHtml(c.number)}</td>
          <td class="name-cell">${escapeHtml(c.name)}</td>

          <td class="move-col r1a">${displayMove(c.r1a)}</td>
          <td class="move-col r1b">${displayMove(c.r1b)}</td>

          <td class="move-col r2a">${displayMove(c.r2a)}</td>
          <td class="move-col r2b">${displayMove(c.r2b)}</td>

          <td class="move-col r3a">${displayMove(c.r3a)}</td>
          <td class="move-col r3b">${displayMove(c.r3b)}</td>

          <td class="actions-col">
            <div class="action-buttons">

              <button
                class="icon-btn"
                title="Edit competitor"
                onclick="editCompetitor(${index})"
              >✎</button>

              <button
                class="icon-btn delete-btn"
                title="Remove competitor"
                onclick="deleteCompetitor(${index})"
              >♙</button>

            </div>
          </td>

        </tr>
      `;
    }

  });

  html += `
      </tbody>
    </table>
  `;

  wrap.innerHTML = html;
}


/* =========================================================
   SEARCH
   ========================================================= */

function filterCompetitors() {

  const search = document
    .getElementById("searchBox")
    .value
    .toLowerCase()
    .trim();

  const rows = document.querySelectorAll("#competitorTable tbody tr");

  rows.forEach(row => {

    if (row.classList.contains("completed-row")) {
      row.style.display = "";
      return;
    }

    row.style.display =
      row.textContent.toLowerCase().includes(search)
        ? ""
        : "none";
  });
}


/* =========================================================
   BUTTON PLACEHOLDERS
   These are ready for us to connect to Code.gs next.
   ========================================================= */

function editCompetitor(index) {
  const c = competitors[index];
  alert(`Edit competitor: ${c.name}\n\nThe editing form will be connected next.`);
}

function deleteCompetitor(index) {
  const c = competitors[index];
  alert(`Remove competitor: ${c.name}\n\nThe delete function will be connected next.`);
}

function addCompetitor() {
  alert("Add Competitor will be connected to the competitor editor next.");
}

function pasteSpreadsheet() {
  alert("Paste from Spreadsheet will be added with the competitor editing functions.");
}

function renumberOrder() {
  alert("Renumber Order will be connected when saving/editing is enabled.");
}

function exportExcel() {
  alert("Export to Excel will be added next.");
}

function goBack() {
  window.location.href = "admin.html";
}


/* =========================================================
   HELPERS
   ========================================================= */

function displayMove(value) {
  return value && value.trim() ? escapeHtml(value) : "—";
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   START
   ========================================================= */

async function init() {
  await Promise.all([
    loadEventDetails(),
    loadCompetitors()
  ]);
}

init();

</script>

</body>
</html>
